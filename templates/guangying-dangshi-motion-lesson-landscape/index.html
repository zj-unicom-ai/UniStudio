<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>光影党史 · EP01（HyperFrames）</title><style>
html,body{margin:0;background:#181516;width:100%;height:100%;overflow:hidden}#main{position:relative;width:1920px;height:1080px;background:#181516;overflow:hidden}#sceneCanvas{display:block;width:1920px;height:1080px}#main video.clip{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:contain}
</style></head><body>
<div id="main" data-composition-id="guangyingdangshi-ep01" data-start="0" data-duration="1200" data-width="1920" data-height="1080">
<canvas id="sceneCanvas" width="1920" height="1080"></canvas>
<!-- HF_OVERLAYS: scripts/build_composition.py 根据存在的 media/huashu/*.mp4 生成 clip，不存在素材时绝不插空视频。 -->
</div>
<script src="./src/episode-data.js"></script><script src="./src/graphics.js"></script>
<!-- 本地执行 npm install 后从 node_modules 加载。独立预览不依赖 GSAP。 -->
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
<script>
(function(){
 // Render contract: HF 使用自身时钟 seek 下面的有限暂停时间线；不可 tl.play()、不可 Date.now()。
 const compId='guangyingdangshi-ep01';
 if(window.gsap){
  const tl=gsap.timeline({paused:true});
  tl.to({clock:0},{clock:1200,duration:1200,ease:'none',onUpdate:function(){window.renderAt(this.targets()[0].clock)}},0);
  window.__timelines=window.__timelines||{};window.__timelines[compId]=tl;
  window.__hfMotionReady=true;
 } else {window.__hfMotionReady=false;console.warn('请 npm install；若只是查看动画请打开 preview.html。')}
 window.addEventListener('message',e=>{if(e.data&&e.data.kind==='seek'&&Number.isFinite(e.data.t)){window.renderAt(e.data.t)}});
 const qp=new URLSearchParams(location.search);if(qp.has('t'))window.renderAt(Number(qp.get('t'))||0);
})();
</script></body></html>
