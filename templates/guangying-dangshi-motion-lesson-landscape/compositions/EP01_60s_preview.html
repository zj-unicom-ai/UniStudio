</head>
<body>
  <div id="root" data-composition-id="guangyingdangshi-ep01-60s" data-start="0" data-duration="60" data-width="1920" data-height="1080" data-fps="30">
    <div id="sample-graphics" class="clip" data-composition-id="sample-graphics" data-composition-src="compositions/EP01_60s/graphics.html" data-start="0" data-duration="45" data-track-index="0"></div>
    <video id="whiteboard-1935" class="clip" data-start="45" data-duration="8" data-track-index="9" data-hf-media-start-basis="global" src="../media/huashu/1935-decision.mp4" muted playsinline preload="auto"></video>
    <video id="whiteboard-1935-coda" class="clip" data-start="53" data-duration="7" data-track-index="9" data-hf-media-start-basis="global" src="../media/huashu/1935-coda.mp4" muted playsinline preload="auto"></video>

  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    const id = 'guangyingdangshi-ep01-60s';
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 60, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines[id] = tl;
    window.__hfMotionReady = true;
  </script>
