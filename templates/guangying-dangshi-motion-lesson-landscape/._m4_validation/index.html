<div id="caption-S01-001" class="clip caption" data-start="0" data-duration="5.7554" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">1921年，上海一处普通的石库门建筑里，一场会议悄然召开。1927年，</text></svg></div>
<div id="caption-S01-002" class="clip caption" data-start="5.7554" data-duration="5.8538" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">革命遭遇严重挫折，人们必须重新思考前进的道路。1929年，福建古田，</text></svg></div>
<div id="caption-S01-003" class="clip caption" data-start="11.6092" data-duration="5.3708" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一次会议回答了军队如何建设的重要问题。1935年，长征途中的遵义，</text></svg></div>
<div id="caption-S01-004" class="clip caption" data-start="16.98" data-duration="5.5" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一次会议成为生死攸关的转折点。这四个年份，连起来是一段怎样的历史？</text></svg></div>
<div id="caption-S01-005" class="clip caption" data-start="22.48" data-duration="6.24" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">四个年份之间并不是四个互不相干的句号。它们留下的问题彼此相连：怎样建立组织，</text></svg></div>
<div id="caption-S01-006" class="clip caption" data-start="28.72" data-duration="5.28" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">怎样在挫折后寻找出路，怎样建设队伍，又怎样在危急时刻总结经验。</text></svg></div>
<div id="caption-S02-001" class="clip caption" data-start="34.35" data-duration="6.02" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">欢迎来到《光影党史》。这一期，我们不准备把一系列历史事件简单地排列在一起，</text></svg></div>
<div id="caption-S02-002" class="clip caption" data-start="40.37" data-duration="6.02" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">也不只停留在“哪一年发生了什么”。我们尝试换一种看法：站在当时的历史处境里，</text></svg></div>
<div id="caption-S02-003" class="clip caption" data-start="46.39" data-duration="5.29" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">看看人们面对的真实问题是什么，又为什么作出了那样的选择。从中共一大，</text></svg></div>
<div id="caption-S02-004" class="clip caption" data-start="51.68" data-duration="6.47" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">到南昌起义和井冈山探索，再到古田会议和遵义会议，历史并不是早已写好答案的考卷。</text></svg></div>
<div id="caption-S02-005" class="clip caption" data-start="58.15" data-duration="6.32" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">很多方向，都是在实践中逐渐摸索出来的。讲述时，我们会把可以核对的日期和决定，</text></svg></div>
<div id="caption-S02-006" class="clip caption" data-start="64.47" data-duration="5.76" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">与今天为了理解历史所作的归纳分开。屏幕上出现的路线、组织结构和过程图，</text></svg></div>
<div id="caption-S02-007" class="clip caption" data-start="70.23" data-duration="4.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">都是帮助理解的示意；它们不代替档案，也不冒充历史现场。</text></svg></div>
<div id="caption-S03-001" class="clip caption" data-start="75.06" data-duration="5.98" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">要理解1921年，首先要看一看20世纪初的中国。那是一个社会剧烈变动的年代。</text></svg></div>
<div id="caption-S03-002" class="clip caption" data-start="81.04" data-duration="5.22" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">传统帝制已经走向终结，新的共和制度出现了，但国家怎样实现稳定、</text></svg></div>
<div id="caption-S03-003" class="clip caption" data-start="86.26" data-duration="5.54" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">社会怎样摆脱贫困、民族怎样走向独立，并没有因为一种制度形式的改变，</text></svg></div>
<div id="caption-S03-004" class="clip caption" data-start="91.8" data-duration="5.68" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">就自动获得答案。晚清以来，围绕救亡图存，中国社会经历过不同方向的探索。</text></svg></div>
<div id="caption-S03-005" class="clip caption" data-start="97.48" data-duration="7.06" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">洋务运动试图以引进近代工业和军事技术来应对危机；维新变法希望推进政治与制度改革；</text></svg></div>
<div id="caption-S03-006" class="clip caption" data-start="104.54" data-duration="5.6916" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">辛亥革命推翻清王朝，结束了中国延续两千多年的君主专制制度。但社会秩序、</text></svg></div>
<div id="caption-S03-007" class="clip caption" data-start="110.2316" data-duration="5.0884" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">政治组织和国家发展面临的问题，仍然复杂而艰巨。人们开始追问：</text></svg></div>
<div id="caption-S03-008" class="clip caption" data-start="115.32" data-duration="5.94" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">怎样才能真正改变中国？这种追问，不仅存在于政治人物之间，也存在于知识分子、</text></svg></div>
<div id="caption-S03-009" class="clip caption" data-start="121.26" data-duration="4.96" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">学生、工人以及越来越多的普通民众之中。新文化运动推动思想解放，</text></svg></div>
<div id="caption-S03-010" class="clip caption" data-start="126.22" data-duration="6.7091" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">五四运动又把爱国诉求、社会动员和新思想传播联系在了一起。不同思潮在中国碰撞、</text></svg></div>
<div id="caption-S03-011" class="clip caption" data-start="132.9291" data-duration="7.3109" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">传播，马克思主义也是在这样的背景下得到更广泛的关注。这里有一个容易被今天的观众忽略的细节：</text></svg></div>
<div id="caption-S03-012" class="clip caption" data-start="140.24" data-duration="6.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">我们现在谈论那些历史阶段，总有一种从结果回看过程的便利。可是对于当时的人来说，</text></svg></div>
<div id="caption-S03-013" class="clip caption" data-start="146.72" data-duration="4.58" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">并不知道后来会发生什么。面对内外部压力和重重不确定性，</text></svg></div>
<div id="caption-S03-014" class="clip caption" data-start="151.3" data-duration="6.32" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">每一条道路都需要回答现实中的问题：如何组织社会力量？怎样把理念转化为实际行动？</text></svg></div>
<div id="caption-S03-015" class="clip caption" data-start="157.62" data-duration="4.96" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">怎样将分散的个人连接为能够持续行动的组织？1919年之后，</text></svg></div>
<div id="caption-S03-016" class="clip caption" data-start="162.58" data-duration="6.7792" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一批接受马克思主义的知识分子开始更加重视与工人运动的结合。早期共产主义组织在上海、</text></svg></div>
<div id="caption-S03-017" class="clip caption" data-start="169.3592" data-duration="6.7008" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">北京、武汉、长沙、济南等地陆续出现，人员交流、思想传播和组织联络不断展开。</text></svg></div>
<div id="caption-S03-018" class="clip caption" data-start="176.06" data-duration="5.7" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">到了1921年，召开一次全国性会议、建立统一的政党组织，逐渐具备了条件。</text></svg></div>
<div id="caption-S03-019" class="clip caption" data-start="181.76" data-duration="5.64" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这就是我们理解中共一大的第一个角度：它不是突然发生在真空里的历史事件，</text></svg></div>
<div id="caption-S03-020" class="clip caption" data-start="187.4" data-duration="6.26" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">而是近代中国长时间寻找出路的社会背景、思想变化和组织实践相互作用的结果。</text></svg></div>
<div id="caption-S03-021" class="clip caption" data-start="193.66" data-duration="5.86" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一个组织的成立，意味着人们开始尝试用更系统、更持续的方式来回答时代的问题。</text></svg></div>
<div id="caption-S03-022" class="clip caption" data-start="199.52" data-duration="7.0453" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">但成立只是起点，真正艰难的考验还在后面。这些探索并非按一条预先确定的路线依次推进。</text></svg></div>
<div id="caption-S03-023" class="clip caption" data-start="206.5653" data-duration="6.1347" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">洋务、变法、共和、思想启蒙和社会运动，各自面对的问题不同，参与者的立场也不相同。</text></svg></div>
<div id="caption-S03-024" class="clip caption" data-start="212.7" data-duration="4.72" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">今天把它们放在一条时间轴上，是为了看清时代环境如何变化，</text></svg></div>
<div id="caption-S03-025" class="clip caption" data-start="217.42" data-duration="4.44" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">不是把每一步都说成通往后来结局的必然台阶。五四运动中，</text></svg></div>
<div id="caption-S03-026" class="clip caption" data-start="221.86" data-duration="6.2" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">学生的爱国行动得到工人罢工等社会力量的响应，运动的范围和参与者随之扩大。</text></svg></div>
<div id="caption-S03-027" class="clip caption" data-start="228.06" data-duration="5.6" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">马克思主义的传播也在这一时期继续发展，并逐渐同中国工人运动相结合。</text></svg></div>
<div id="caption-S03-028" class="clip caption" data-start="233.66" data-duration="5.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这里讲的是一条重要思想线索，不意味着当时所有参与者持有同一种思想。</text></svg></div>
<div id="caption-S03-029" class="clip caption" data-start="239.14" data-duration="5.74" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">早期组织在不同城市出现后，除了传播理论，还要面对实际工作：怎样联络成员，</text></svg></div>
<div id="caption-S03-030" class="clip caption" data-start="244.88" data-duration="5.66" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">怎样建立组织，怎样开展工人宣传与工会工作。人员不多、交通通信条件有限，</text></svg></div>
<div id="caption-S03-031" class="clip caption" data-start="250.54" data-duration="4.9" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">组织能不能保持联系，本身就是一道现实考题。把这层背景补上，</text></svg></div>
<div id="caption-S03-032" class="clip caption" data-start="255.44" data-duration="4.52" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">我们才能理解一大为何既是思想汇集，也是组织建设的起点。</text></svg></div>
<div id="caption-S04-001" class="clip caption" data-start="260.31" data-duration="4.96" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">时间来到1921年7月23日。上海法租界望志路106号，</text></svg></div>
<div id="caption-S04-002" class="clip caption" data-start="265.27" data-duration="6.38" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">也就是今天的兴业路76号，一场影响深远的会议在这里开幕。今天我们走到现场，</text></svg></div>
<div id="caption-S04-003" class="clip caption" data-start="271.65" data-duration="6.4" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">会看到一座具有典型上海石库门风格的建筑。它并不是宏大的宫殿，而是一处城市民居。</text></svg></div>
<div id="caption-S04-004" class="clip caption" data-start="278.05" data-duration="5.74" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">正是这种空间与后来历史影响之间的反差，让这段故事有一种特殊的力量。</text></svg></div>
<div id="caption-S04-005" class="clip caption" data-start="283.79" data-duration="6.0057" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">中共一大有12名正式代表；包惠僧受陈独秀指派参会。把他计入中国参会者，</text></svg></div>
<div id="caption-S04-006" class="clip caption" data-start="289.7957" data-duration="5.2743" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">共有13人。他们代表着全国50多名党员，另有两位共产国际代表出席。</text></svg></div>
<div id="caption-S04-007" class="clip caption" data-start="295.07" data-duration="7.02" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">回望这些数字，我们会发现，起步时期的组织规模非常有限。这既意味着要面对巨大的不确定性，</text></svg></div>
<div id="caption-S04-008" class="clip caption" data-start="302.09" data-duration="6.66" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">也说明组织建设、思想沟通和共同目标的重要性。人数不多，不代表要解决的问题简单。</text></svg></div>
<div id="caption-S04-009" class="clip caption" data-start="308.75" data-duration="4.6" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">会议并没有始终在一个地方进行。由于会场受到暗探注意和搜查，</text></svg></div>
<div id="caption-S04-010" class="clip caption" data-start="313.35" data-duration="5.56" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">最后一天的会议转移到浙江嘉兴南湖的游船上举行。今天我们熟悉的“红船”，</text></svg></div>
<div id="caption-S04-011" class="clip caption" data-start="318.91" data-duration="4.38" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">由此成为这一历史起点的重要象征。不过在讲述这一段历史时，</text></svg></div>
<div id="caption-S04-012" class="clip caption" data-start="323.29" data-duration="5.8282" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">要分清真实史料和后来的纪念景观：今天能看到的纪念船与相关展陈，</text></svg></div>
<div id="caption-S04-013" class="clip caption" data-start="329.1182" data-duration="5.5318" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">是帮助公众理解历史的纪念载体，不应直接说成1921年的原船实拍。</text></svg></div>
<div id="caption-S04-014" class="clip caption" data-start="334.65" data-duration="6.22" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这次大会确定了“中国共产党”这一名称，通过党的第一个纲领和决议，选举产生中央局。</text></svg></div>
<div id="caption-S04-015" class="clip caption" data-start="340.87" data-duration="6.1" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">现存的相关纲领影印资料并非一大现场使用的中文原件；本片只用结构示意，</text></svg></div>
<div id="caption-S04-016" class="clip caption" data-start="346.97" data-duration="5.7486" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">不把示意图冒充档案。这些事情今天看起来像是会议程序，但放到历史处境中，</text></svg></div>
<div id="caption-S04-017" class="clip caption" data-start="352.7186" data-duration="5.6314" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">有不同的意义。它意味着分散在各地、抱有相近理想的人，开始形成一个有名称、</text></svg></div>
<div id="caption-S04-018" class="clip caption" data-start="358.35" data-duration="4.35" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">有共同纲领、有组织联系的全国性政党。很多人看党史，</text></svg></div>
<div id="caption-S04-019" class="clip caption" data-start="362.7" data-duration="5.13" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">习惯把注意力放在重要人物和标志性地点上。但我们也应该看到另一条线：</text></svg></div>
<div id="caption-S04-020" class="clip caption" data-start="367.83" data-duration="6.44" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一个政治组织怎样建立共同的思想基础、怎样形成组织关系、怎样把主张落实成行动。</text></svg></div>
<div id="caption-S04-021" class="clip caption" data-start="374.27" data-duration="6.56" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">单靠激情可以开始一件事，却很难保证一件事长期持续。共同纲领、组织制度和实际工作，</text></svg></div>
<div id="caption-S04-022" class="clip caption" data-start="380.83" data-duration="7.08" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">是把理想转化为行动的必要条件。在这一阶段，党把工作重心放在组织和发动工人运动等方面；</text></svg></div>
<div id="caption-S04-023" class="clip caption" data-start="387.91" data-duration="5.52" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">它对中国社会结构的认识、对革命策略的选择，也将在之后的实践中不断变化。</text></svg></div>
<div id="caption-S04-024" class="clip caption" data-start="393.43" data-duration="6.76" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">从历史的视角看，1921年的重要性，既在于“成立”，更在于开启了一段持续探索的历史。</text></svg></div>
<div id="caption-S04-025" class="clip caption" data-start="400.19" data-duration="5.74" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">接下来，时代很快将用更加严酷的方式提出问题：当原来的行动方式遭遇挫折，</text></svg></div>
<div id="caption-S04-026" class="clip caption" data-start="405.93" data-duration="7.14" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">应该怎样重新寻找前进的路径？大会最终形成的文件，后来成为认识建党初期主张的重要依据。</text></svg></div>
<div id="caption-S04-027" class="clip caption" data-start="413.07" data-duration="5.74" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">观众如果在其他材料中看到纲领的译本，要留意版本、收藏机构和形成过程。</text></svg></div>
<div id="caption-S04-028" class="clip caption" data-start="418.81" data-duration="6.96" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">影印件看起来古旧，并不能单凭外观判断它就是会场原件；本片用清楚的文字标签和结构示意，</text></svg></div>
<div id="caption-S04-029" class="clip caption" data-start="425.77" data-duration="6.38" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">避免把后来的复制品误认成现场文献。一大之后，组织还需要把会议决议落实到各地工作。</text></svg></div>
<div id="caption-S04-030" class="clip caption" data-start="432.15" data-duration="5.4" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">工人运动不是抽象口号，它包括面向工人的宣传教育、建立工会组织、</text></svg></div>
<div id="caption-S04-031" class="clip caption" data-start="437.55" data-duration="6.36" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">开展具体联络等工作。不同城市的产业和社会条件并不一样，工作方式也不能完全照搬。</text></svg></div>
<div id="caption-S04-032" class="clip caption" data-start="443.91" data-duration="5.92" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">全国性组织的意义，正在于建立共同方向，同时让不同地方的行动能够彼此联系。</text></svg></div>
<div id="caption-S04-033" class="clip caption" data-start="449.83" data-duration="5.76" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">因此，石库门与南湖所代表的，不只是两个地名。一个是会议开幕的城市空间，</text></svg></div>
<div id="caption-S04-034" class="clip caption" data-start="455.59" data-duration="5.24" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一个是会议后来继续进行的地点；两者共同指向政党成立的历史节点。</text></svg></div>
<div id="caption-S04-035" class="clip caption" data-start="460.83" data-duration="7.46" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">红船作为后来的纪念象征，能帮助我们记住这一节点，却应当与1921年的原始现场严格区分。</text></svg></div>
<div id="caption-S05-001" class="clip caption" data-start="468.64" data-duration="5.84" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">1927年，是理解中国革命早期探索不能绕过的一年。第一次国共合作破裂、</text></svg></div>
<div id="caption-S05-002" class="clip caption" data-start="474.48" data-duration="5.22" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">大革命遭受失败，革命形势急剧变化。对于当时的中国共产党人而言，</text></svg></div>
<div id="caption-S05-003" class="clip caption" data-start="479.7" data-duration="5.5" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">面对的已不只是怎样宣传理念、扩大组织的问题，而是在严酷的现实条件下，</text></svg></div>
<div id="caption-S05-004" class="clip caption" data-start="485.2" data-duration="4.72" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">如何保存力量、怎样开展新的斗争。8月1日，南昌起义爆发。</text></svg></div>
<div id="caption-S05-005" class="clip caption" data-start="489.92" data-duration="5.94" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这一事件标志着中国共产党开始独立领导革命战争、创建人民军队。从历史进程看，</text></svg></div>
<div id="caption-S05-006" class="clip caption" data-start="495.86" data-duration="7.76" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">它是一种重要的转向：政治理想要继续推进，必须思考在特殊环境下怎样形成自己的组织力量与行动能力。</text></svg></div>
<div id="caption-S05-007" class="clip caption" data-start="503.62" data-duration="6.14" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">但这种转向并不意味着新的革命道路已经完全成熟，许多问题仍需要进一步回答。</text></svg></div>
<div id="caption-S05-008" class="clip caption" data-start="509.76" data-duration="5.06" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">秋收起义受挫后，部队于9月19日在文家市决定放弃攻打长沙，</text></svg></div>
<div id="caption-S05-009" class="clip caption" data-start="514.82" data-duration="5.1624" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">转向敌人力量较弱的农村和山区。沿罗霄山脉南下途中，9月29日，</text></svg></div>
<div id="caption-S05-010" class="clip caption" data-start="519.9824" data-duration="5.9509" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">部队到达江西永新县三湾村并进行改编；10月27日，才抵达井冈山茨坪。</text></svg></div>
<div id="caption-S05-011" class="clip caption" data-start="525.9333" data-duration="5.3667" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">三湾改编建立各级党组织和党代表制度，并确立“支部建在连上”等安排。</text></svg></div>
<div id="caption-S05-012" class="clip caption" data-start="531.3" data-duration="5.58" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这并非一个孤立的军事细节，它触及的是一个组织性问题：怎样让共同的方向、</text></svg></div>
<div id="caption-S05-013" class="clip caption" data-start="536.88" data-duration="5.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">政治目标和基层行动之间保持联系。接下来，井冈山的斗争实践继续展开。</text></svg></div>
<div id="caption-S05-014" class="clip caption" data-start="542.36" data-duration="5.96" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">以农村为主要活动空间，创建革命根据地，开展武装斗争，并在具体环境中调整方法，</text></svg></div>
<div id="caption-S05-015" class="clip caption" data-start="548.32" data-duration="6.3" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">逐渐形成与早先设想不同的实践路径。这里的关键词是“逐渐”。我们今天常说的道路，</text></svg></div>
<div id="caption-S05-016" class="clip caption" data-start="554.62" data-duration="4.24" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">不是某一天在纸上一次性设计完成的。它是在艰苦的探索、</text></svg></div>
<div id="caption-S05-017" class="clip caption" data-start="558.86" data-duration="5.26" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">经验积累和错误修正中不断清晰起来的。为什么这段变化值得单独讲？</text></svg></div>
<div id="caption-S05-018" class="clip caption" data-start="564.12" data-duration="6.32" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">因为它提醒我们，历史上的路线选择，不只是原则口号的变化，还涉及组织能否存续、</text></svg></div>
<div id="caption-S05-019" class="clip caption" data-start="570.44" data-duration="6.44" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">群众工作如何进行、军事与政治工作如何配合等非常现实的问题。不同地区的社会条件、</text></svg></div>
<div id="caption-S05-020" class="clip caption" data-start="576.88" data-duration="6.76" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">力量对比和群众基础，都影响具体的行动方式。当我们在地图上看到从城市到农村的转换，</text></svg></div>
<div id="caption-S05-021" class="clip caption" data-start="583.64" data-duration="5.08" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">不应把它理解成简单的地理移动。真正发生变化的，是对中国国情、</text></svg></div>
<div id="caption-S05-022" class="clip caption" data-start="588.72" data-duration="5.6" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">革命力量和实践条件的认识。如果说1921年首先回答了“怎样建立一个组织”，</text></svg></div>
<div id="caption-S05-023" class="clip caption" data-start="594.32" data-duration="5.88" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">那么1927年前后的探索进一步提出了“这个组织怎样在现实中开展工作、</text></svg></div>
<div id="caption-S05-024" class="clip caption" data-start="600.2" data-duration="6.66" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">寻找适合的行动路径”。在这段历史里，挫折是真实的，人员牺牲和组织困难也是真实的。</text></svg></div>
<div id="caption-S05-025" class="clip caption" data-start="606.86" data-duration="5.2" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">把它讲得过分轻松，会失去历史的重量；把探索说成没有曲折的直线，</text></svg></div>
<div id="caption-S05-026" class="clip caption" data-start="612.06" data-duration="5.54" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">又会错过最值得学习的部分。党史中许多重大选择，都与具体困难相联系。</text></svg></div>
<div id="caption-S05-027" class="clip caption" data-start="617.6" data-duration="6.24" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">理解这些问题，才能理解后来古田会议要回答的核心问题。把这段过程按日历重新摆开，</text></svg></div>
<div id="caption-S05-028" class="clip caption" data-start="623.84" data-duration="5.94" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">能看到决策不是在后来熟悉的井冈山名称出现时才突然完成的。秋收起义受挫后，</text></svg></div>
<div id="caption-S05-029" class="clip caption" data-start="629.78" data-duration="5.5" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">文家市会议讨论去向，选择向农村和山区转移；部队在行进途中于三湾改编；</text></svg></div>
<div id="caption-S05-030" class="clip caption" data-start="635.28" data-duration="6.22" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">到10月下旬才进入井冈山。每个地点对应的问题不同：先要决定如何保存力量，</text></svg></div>
<div id="caption-S05-031" class="clip caption" data-start="641.5" data-duration="6.7" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">再要重整队伍，随后才是在新的环境中寻找立足点。三湾改编的意义也不只是一张编制表。</text></svg></div>
<div id="caption-S05-032" class="clip caption" data-start="648.2" data-duration="6.06" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">它通过党组织和党代表制度，把基层组织建设纳入队伍运行；士兵委员会等安排，</text></svg></div>
<div id="caption-S05-033" class="clip caption" data-start="654.26" data-duration="4.38" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">还涉及部队内部的管理和关系。后来的制度有其发展过程，</text></svg></div>
<div id="caption-S05-034" class="clip caption" data-start="658.64" data-duration="6.3" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">讲述时不应把所有成熟做法都倒置到同一天。抵达井冈山也不等于道路探索已经结束。</text></svg></div>
<div id="caption-S05-035" class="clip caption" data-start="664.94" data-duration="5.8" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">当地的社会结构、交通条件、群众基础和军事压力，都会影响根据地怎样建设。</text></svg></div>
<div id="caption-S05-036" class="clip caption" data-start="670.74" data-duration="5.82" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">之后的实践还包括同地方武装建立联系、开展群众工作、应对围攻和补给困难。</text></svg></div>
<div id="caption-S05-037" class="clip caption" data-start="676.56" data-duration="5.46" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">我们把这些细节纳入画面，是为了让“转向农村”呈现为一连串行动和条件，</text></svg></div>
<div id="caption-S05-038" class="clip caption" data-start="682.02" data-duration="5.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">而不是地图上的一根箭头。这个节点也提醒我们，理解挫折不等于美化挫折。</text></svg></div>
<div id="caption-S05-039" class="clip caption" data-start="687.5" data-duration="6.98" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">起义部队付出的代价真实存在；经验是在困难中形成的，但困难本身并不会自动带来正确答案。</text></svg></div>
<div id="caption-S05-040" class="clip caption" data-start="694.48" data-duration="6" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">选择方向、组织队伍、获得群众支持、检验办法，缺一环都可能影响行动能否持续。</text></svg></div>
<div id="caption-S06-001" class="clip caption" data-start="700.83" data-duration="2.98" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">1929年12月28日至29日，</text></svg></div>
<div id="caption-S06-002" class="clip caption" data-start="703.81" data-duration="5.5815" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">中国工农红军第四军第九次党的代表大会在福建上杭古田召开。历史上，</text></svg></div>
<div id="caption-S06-003" class="clip caption" data-start="709.3915" data-duration="4.9785" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">我们把它称为古田会议。它所回答的，不单是一次战斗怎样指挥的问题，</text></svg></div>
<div id="caption-S06-004" class="clip caption" data-start="714.37" data-duration="6.26" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">而是更基础的建设问题：在当时的条件下，怎样把一支成员来源多样的革命队伍，</text></svg></div>
<div id="caption-S06-005" class="clip caption" data-start="720.63" data-duration="5.04" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">建设成为有明确政治方向、有组织纪律的新型人民军队。从今天来看，</text></svg></div>
<div id="caption-S06-006" class="clip caption" data-start="725.67" data-duration="5.84" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">任何长期运行的组织都离不开制度和能力建设。但当时面临的环境更加特殊。</text></svg></div>
<div id="caption-S06-007" class="clip caption" data-start="731.51" data-duration="5.12" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">部队的成员构成比较复杂，作战条件非常艰苦，军队内部在思想认识、</text></svg></div>
<div id="caption-S06-008" class="clip caption" data-start="736.63" data-duration="4.52" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">组织生活和政治工作方面存在实际问题。只有把这些问题讲清楚，</text></svg></div>
<div id="caption-S06-009" class="clip caption" data-start="741.15" data-duration="4.74" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">我们才能理解为什么古田会议不是一场普通的内部工作会议。</text></svg></div>
<div id="caption-S06-010" class="clip caption" data-start="745.89" data-duration="5.92" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">古田会议通过了《中国共产党红军第四军第九次代表大会决议案》，确立思想建党、</text></svg></div>
<div id="caption-S06-011" class="clip caption" data-start="751.81" data-duration="6.02" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">政治建军的重要原则。决议针对单纯军事观点、极端民主化、流寇思想等问题，</text></svg></div>
<div id="caption-S06-012" class="clip caption" data-start="757.83" data-duration="6.46" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">强调加强思想教育、党的组织建设和政治工作。后来的概括可以帮助我们理解它的影响，</text></svg></div>
<div id="caption-S06-013" class="clip caption" data-start="764.29" data-duration="6.52" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">但不能替代决议原文和当时的历史语境。换句话说，组织能力不仅体现在人数和装备上，</text></svg></div>
<div id="caption-S06-014" class="clip caption" data-start="770.81" data-duration="6.12" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">也体现在成员能否理解共同目标、遇到分歧时能否通过组织方式讨论和处理问题，</text></svg></div>
<div id="caption-S06-015" class="clip caption" data-start="776.93" data-duration="6.08" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">以及面临困难时能否保持基本的行动秩序。用今天的语言概括，这涉及组织的方向、</text></svg></div>
<div id="caption-S06-016" class="clip caption" data-start="783.01" data-duration="4.9" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">机制与执行之间的关系。不过这里的当代概括只是帮助理解历史，</text></svg></div>
<div id="caption-S06-017" class="clip caption" data-start="787.91" data-duration="6.58" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">不能取代对古田会议原始文献和具体历史背景的研究。古田会议还有一层重要意义：</text></svg></div>
<div id="caption-S06-018" class="clip caption" data-start="794.49" data-duration="5.62" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">它说明组织建设本身也是一种不断实践、不断纠偏的过程。时代和任务变化之后，</text></svg></div>
<div id="caption-S06-019" class="clip caption" data-start="800.11" data-duration="5.8" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">单靠早期形成的方式并不足够，需要把实际情况中的问题提出来，再通过会议、讨论、</text></svg></div>
<div id="caption-S06-020" class="clip caption" data-start="805.91" data-duration="7.06" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">制度建设和日常工作来解决。如果把1921、1927和1929三个节点连起来看，</text></svg></div>
<div id="caption-S06-021" class="clip caption" data-start="812.97" data-duration="5.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">我们会发现一条逐渐清晰的线索。1921年，建立政党并确立共同纲领；</text></svg></div>
<div id="caption-S06-022" class="clip caption" data-start="818.45" data-duration="5.2123" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">1927年前后，在挫折中探索行动道路与组织形态；1929年，</text></svg></div>
<div id="caption-S06-023" class="clip caption" data-start="823.6623" data-duration="7.0277" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">则更加系统地回答特殊环境下队伍如何建设的问题。这几个历史节点并不能概括全部党史，</text></svg></div>
<div id="caption-S06-024" class="clip caption" data-start="830.69" data-duration="7.06" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">但它们帮助我们看到：一条道路的形成，离不开方向的确认，也离不开方法和组织方式的不断调整。</text></svg></div>
<div id="caption-S06-025" class="clip caption" data-start="837.75" data-duration="6.34" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">然而，历史的考验并没有就此结束。几年之后，中央红军又面临一次极其严峻的危机。</text></svg></div>
<div id="caption-S06-026" class="clip caption" data-start="844.09" data-duration="5.84" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">1935年遵义会议之所以被视为重要转折，需要把镜头重新拉回到长征途中。</text></svg></div>
<div id="caption-S06-027" class="clip caption" data-start="849.93" data-duration="7.16" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">决议的价值，可以从它讨论的问题看出来。它把思想问题、党内组织和军队政治工作放在一起处理，</text></svg></div>
<div id="caption-S06-028" class="clip caption" data-start="857.09" data-duration="4.6" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">要求通过经常性的组织生活、教育和纪律建设来纠正偏差。</text></svg></div>
<div id="caption-S06-029" class="clip caption" data-start="861.69" data-duration="5.92" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这里列举的几个问题来自党史资料对决议内容的概括，不应被改写成今天的口号，</text></svg></div>
<div id="caption-S06-030" class="clip caption" data-start="867.61" data-duration="6.52" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">更不能把概括句加上引号当作会议原话。古田会议并不是在安定环境中进行的理论讨论。</text></svg></div>
<div id="caption-S06-031" class="clip caption" data-start="874.13" data-duration="5.86" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">队伍长期处于战斗、转移和物资紧张之中，成员经历、认识水平也存在差异。</text></svg></div>
<div id="caption-S06-032" class="clip caption" data-start="879.99" data-duration="5.76" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">要让一支队伍在这些条件下保持共同目标，既要回答政治方向，也要回答怎样组织、</text></svg></div>
<div id="caption-S06-033" class="clip caption" data-start="885.75" data-duration="6.3" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">怎样教育、怎样执行和怎样接受监督。会议决议是对这些实际问题作出的集中回应。</text></svg></div>
<div id="caption-S06-034" class="clip caption" data-start="892.05" data-duration="5.76" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">从一大到古田，讨论的层次发生了变化：前者建立政党组织并确定纲领，</text></svg></div>
<div id="caption-S06-035" class="clip caption" data-start="897.81" data-duration="4.78" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">后者面对的是如何把政治原则落实到军队内部的组织与日常工作。</text></svg></div>
<div id="caption-S06-036" class="clip caption" data-start="902.59" data-duration="4.84" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">两者并不是同一个问题的重复，而是在新的历史任务下接续推进。</text></svg></div>
<div id="caption-S07-001" class="clip caption" data-start="907.78" data-duration="6.44" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">1934年10月，中央红军开始长征。第五次反“围剿”失败以及长征初期的严重损失，</text></svg></div>
<div id="caption-S07-002" class="clip caption" data-start="914.22" data-duration="4.24" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">使党和红军处于十分困难的局面。对当时的领导层而言，</text></svg></div>
<div id="caption-S07-003" class="clip caption" data-start="918.46" data-duration="5.32" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一些军事决策与组织领导问题必须得到认真总结。这里需要强调的是，</text></svg></div>
<div id="caption-S07-004" class="clip caption" data-start="923.78" data-duration="4.72" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">后来被写进教科书的“历史转折点”，在发生时并不是一个轻松的时刻。</text></svg></div>
<div id="caption-S07-005" class="clip caption" data-start="928.5" data-duration="5.56" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">它往往意味着此前的做法已经无法有效应对现实，必须正视错误和困难。</text></svg></div>
<div id="caption-S07-006" class="clip caption" data-start="934.06" data-duration="6.12" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">1935年1月15日至17日，中共中央政治局在贵州遵义召开扩大会议。</text></svg></div>
<div id="caption-S07-007" class="clip caption" data-start="940.18" data-duration="6.88" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">会议集中解决当时具有决定意义的军事和组织问题，讨论第五次反“围剿”失败的经验教训；</text></svg></div>
<div id="caption-S07-008" class="clip caption" data-start="947.06" data-duration="6.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">会议增选毛泽东为中央政治局常委、委托张闻天起草决议，并取消长征前成立的“三人团”。</text></svg></div>
<div id="caption-S07-009" class="clip caption" data-start="953.54" data-duration="5.66" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">遵义会议在党的历史上被称为生死攸关的转折点。为什么说它具有转折意义？</text></svg></div>
<div id="caption-S07-010" class="clip caption" data-start="959.2" data-duration="7.38" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">一个关键在于，会议开始在极其紧迫的实践条件下，独立自主地思考和处理中国革命中的重大问题，</text></svg></div>
<div id="caption-S07-011" class="clip caption" data-start="966.58" data-duration="6.24" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">对此前的决策进行总结、讨论和调整。这不是把某一个决定简单替换成另一个决定，</text></svg></div>
<div id="caption-S07-012" class="clip caption" data-start="972.82" data-duration="5.0347" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">而是面对不断变化的情况，重新审视判断依据和工作方法。当然，</text></svg></div>
<div id="caption-S07-013" class="clip caption" data-start="977.8547" data-duration="4.4653" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">也不能把历史讲成“开了一次会，所有问题就立刻解决”。会议之后，</text></svg></div>
<div id="caption-S07-014" class="clip caption" data-start="982.32" data-duration="5.74" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">军事行动和领导分工仍经历进一步调整：2月初，中央政治局常委分工发生变化；</text></svg></div>
<div id="caption-S07-015" class="clip caption" data-start="988.06" data-duration="5.04" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">3月，成立新的三人军事指挥小组。红军仍需应对复杂的追击、</text></svg></div>
<div id="caption-S07-016" class="clip caption" data-start="993.1" data-duration="6.74" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">转移和生存挑战。我们理解遵义会议，应把它放在长征全程和此前长期探索的历史脉络中，</text></svg></div>
<div id="caption-S07-017" class="clip caption" data-start="999.84" data-duration="5.7" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">而不是只停留在一个会址或一张会议照片上。从1921年上海的一处石库门，</text></svg></div>
<div id="caption-S07-018" class="clip caption" data-start="1005.54" data-duration="5.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">到1935年遵义的一次重要会议，十余年间经历了组织建立、革命实践、</text></svg></div>
<div id="caption-S07-019" class="clip caption" data-start="1011.02" data-duration="6.42" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">道路探索和危机应对。那些节点之所以值得被反复讲述，不只是因为发生了重要事件，</text></svg></div>
<div id="caption-S07-020" class="clip caption" data-start="1017.44" data-duration="7.1" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">更因为它们让我们看见历史参与者怎样面对问题、认识问题，又怎样在现实变化中不断调整行动。</text></svg></div>
<div id="caption-S07-021" class="clip caption" data-start="1024.54" data-duration="6.34" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">长征初期的损失把军事指挥问题推到眼前。中央红军在第五次反“围剿”失败后转移，</text></svg></div>
<div id="caption-S07-022" class="clip caption" data-start="1030.88" data-duration="6.66" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">突破封锁的过程异常艰难。湘江战役等重大损失，使此前的战略判断受到严厉检验。</text></svg></div>
<div id="caption-S07-023" class="clip caption" data-start="1037.54" data-duration="6.455" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">讲到这些内容，镜头不需要制造战斗场面；用不断收窄的路线、人员数字的空缺和停顿的时间轴，</text></svg></div>
<div id="caption-S07-024" class="clip caption" data-start="1043.995" data-duration="6.665" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">就能呈现压力，而不伪造历史影像。遵义会议的讨论围绕军事指挥和此前的经验教训展开。</text></svg></div>
<div id="caption-S07-025" class="clip caption" data-start="1050.66" data-duration="5.28" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">会议决议、常委分工和取消“三人团”等决定有具体的时间与制度边界。</text></svg></div>
<div id="caption-S07-026" class="clip caption" data-start="1055.94" data-duration="7.2" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">会议后张闻天负总责、毛泽东协助周恩来军事指挥等领导分工是在之后的行程中进一步调整；</text></svg></div>
<div id="caption-S07-027" class="clip caption" data-start="1063.14" data-duration="5.12" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">3月成立新的三人军事指挥小组，也属于会后发展。把这几个层次分开，</text></svg></div>
<div id="caption-S07-028" class="clip caption" data-start="1068.26" data-duration="5.2067" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">才能看见转折是一个过程，而不是一句话完成的瞬间。会议的重要性，</text></svg></div>
<div id="caption-S07-029" class="clip caption" data-start="1073.4667" data-duration="7.1733" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">还在于它开启了党在没有共产国际代表直接指导的条件下，独立自主处理中国革命实际问题的新阶段。</text></svg></div>
<div id="caption-S07-030" class="clip caption" data-start="1080.64" data-duration="5.54" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这个概括强调的是决策能力的变化，并不表示外部环境从此变得容易，</text></svg></div>
<div id="caption-S07-031" class="clip caption" data-start="1086.18" data-duration="7.62" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">也不表示所有争论在遵义一次性结束。此后的行军和战略选择仍有风险，新的问题仍需要新的判断。</text></svg></div>
<div id="caption-S08-001" class="clip caption" data-start="1094.15" data-duration="5.35" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">回顾今天讲到的四个历史节点，我们至少可以提炼出三个观察角度。第一，</text></svg></div>
<div id="caption-S08-002" class="clip caption" data-start="1099.5" data-duration="5.97" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">理解历史选择，不能脱离当时的社会条件和具体困难；只有把问题放回时代背景，</text></svg></div>
<div id="caption-S08-003" class="clip caption" data-start="1105.47" data-duration="6.58" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">结论才不会变得空泛。第二，理想和目标必须通过组织、制度与持续的实践才能发挥作用。</text></svg></div>
<div id="caption-S08-004" class="clip caption" data-start="1112.05" data-duration="6.72" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">第三，历史道路不是直线展开的；遇到挫折、总结经验、修正认识，本身就是探索的重要组成部分。</text></svg></div>
<div id="caption-S08-005" class="clip caption" data-start="1118.77" data-duration="5.86" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">这三点，是对历史过程的一种归纳，而不是把复杂党史压缩成几句万能公式。</text></svg></div>
<div id="caption-S08-006" class="clip caption" data-start="1124.63" data-duration="6.48" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">真正的学习，仍然要回到史料，理解其背景与细节。这三个角度可以作为今天的观察工具，</text></svg></div>
<div id="caption-S08-007" class="clip caption" data-start="1131.11" data-duration="5.54" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">但不能变成套在所有历史事件上的固定答案。每个决定都要回到当时的材料、</text></svg></div>
<div id="caption-S08-008" class="clip caption" data-start="1136.65" data-duration="6.04" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">参与者和条件中去理解；同一个词放在不同年份，可能对应完全不同的现实问题。</text></svg></div>
<div id="caption-S08-009" class="clip caption" data-start="1142.69" data-duration="4.18" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">我们今天所说的“组织”“实践”和“调整”，是便于交流的概括，</text></svg></div>
<div id="caption-S08-010" class="clip caption" data-start="1146.87" data-duration="6.02" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">历史人物当时的表述和行动仍应以可查证的文献为准。如果把四个节点放在一起，</text></svg></div>
<div id="caption-S08-011" class="clip caption" data-start="1152.89" data-duration="5.34" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">最清晰的不是一条毫无波折的直线，而是一组问题不断递进：先建立组织，</text></svg></div>
<div id="caption-S08-012" class="clip caption" data-start="1158.23" data-duration="5.86" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">随后探索革命道路，再回应队伍建设，最后在危机中调整领导和军事决策。</text></svg></div>
<div id="caption-S08-013" class="clip caption" data-start="1164.09" data-duration="3.28" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">每一步都留下经验，也留下继续研究的空间。</text></svg></div>
<div id="caption-S09-001" class="clip caption" data-start="1167.72" data-duration="6.36" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">从石库门到遵义，我们看到的不只是几个年份，而是一段不断认识现实、探索道路的历史。</text></svg></div>
<div id="caption-S09-002" class="clip caption" data-start="1174.08" data-duration="5.56" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">感谢收看《光影党史》，我们下期再见。今天的短片只是沿着几个节点打开一扇门。</text></svg></div>
<div id="caption-S09-003" class="clip caption" data-start="1179.64" data-duration="6.5067" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">想继续了解，可以从一大档案、秋收起义与三湾改编、古田会议决议以及遵义会议文献读起。</text></svg></div>
<div id="caption-S09-004" class="clip caption" data-start="1186.1467" data-duration="7.2133" data-track-index="20">
<svg viewBox="0 0 1920 1080" aria-label="旁白字幕"><rect x="96" y="868" width="1725" height="88" rx="4" fill="rgba(10,7,8,.84)"/><rect x="96" y="868" width="8" height="88" fill="#A94542"/><text x="138" y="923" fill="#F6F0E6" font-size="35">历史事实有出处，艺术化的示意也应当清楚标注；当两者各自站稳，故事才有可信的力量。</text></svg></div>
</div>
