<script>
(function () {
  'use strict';
  const CID = "yinian-outro-v1";
  const root = document.querySelector('#yinian-outro-root');
  const config = JSON.parse(root.querySelector('.yinian-outro-config').textContent);
  const cue = (id) => config.cues.find((item) => item.id === id);

  const buildTimeline = () => {
    if (!root || !window.gsap) return;
    const previous = window.__timelines[CID];
    if (previous) previous.kill();

    const gsap = window.gsap;
    const tl = gsap.timeline({ paused: true });
    const dot = root.querySelector('.logo-dot');
    const rings = {
      'ring-inner': root.querySelector('.ring-inner'),
      'ring-middle': root.querySelector('.ring-middle'),
      'ring-outer': root.querySelector('.ring-outer')
    };
    const brand = root.querySelector('.brand-line');
    const tagline = root.querySelector('.tagline-line');
    const goodbye = root.querySelector('.goodbye-line');
    const reflection = root.querySelector('#yinian-outro-reflection');
    const scene = root.querySelector('.outro-landscape');
    const foreground = root.querySelector('.foreground-art');

    gsap.set(scene, { autoAlpha: 1 });
    gsap.set(foreground, { autoAlpha: 1 });
    gsap.set(reflection, { autoAlpha: 0 });
    gsap.set(dot, { autoAlpha: 0, scale: 0.98, transformOrigin: '50% 50%' });
    gsap.set([brand, tagline, goodbye], { autoAlpha: 0, y: 0 });
    Object.values(rings).forEach((path) => {
      const length = path.getTotalLength();
      path.dataset.pathLength = String(length);
      gsap.set(path, { opacity: 0, strokeDasharray: length, strokeDashoffset: length });
    });

    let item = cue('dot');
    tl.fromTo(dot,
      { autoAlpha: 0, scale: 0.98 },
      { autoAlpha: 1, scale: 1, duration: item.endSec - item.startSec, ease: 'power2.out' },
      item.startSec);
    tl.to(reflection, { autoAlpha: 1, duration: item.endSec - item.startSec, ease: 'power2.out' }, item.startSec);

    ['ring-inner', 'ring-middle', 'ring-outer'].forEach((id) => {
      item = cue(id);
      const path = rings[id];
      const length = Number(path.dataset.pathLength);
      tl.set(path, { opacity: Number(path.dataset.baseOpacity) }, item.startSec);
      tl.fromTo(path,
        { strokeDashoffset: length },
        { strokeDashoffset: 0, duration: item.endSec - item.startSec, ease: 'power2.out' },
        item.startSec);
    });

    item = cue('brand');
    tl.fromTo(brand, { autoAlpha: 0, y: 18 },
      { autoAlpha: 1, y: 0, duration: item.endSec - item.startSec, ease: 'power3.out' }, item.startSec);
    item = cue('tagline');
    tl.fromTo(tagline, { autoAlpha: 0, y: 12 },
      { autoAlpha: 1, y: 0, duration: item.endSec - item.startSec, ease: 'power3.out' }, item.startSec);
    item = cue('goodbye');
    tl.fromTo(goodbye, { autoAlpha: 0 },
      { autoAlpha: 1, duration: item.endSec - item.startSec, ease: 'power3.out' }, item.startSec);

    item = cue('fadeOut');
    tl.to([scene, foreground], {
      autoAlpha: 0,
      duration: item.endSec - item.startSec,
      ease: 'power2.in'
    }, item.startSec);

    window.__timelines[CID] = tl;
    tl.pause(0);
  };

  document.fonts.ready.then(buildTimeline);
})();
</script>
