<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
</head>
<body>
<template>
<style>

@font-face {
  font-family:'ZCOOL QingKe HuangYou';
  src:url('assets/fonts/ZCOOLQingKeHuangYou-Regular.ttf') format('truetype');
  font-weight:400; font-display:block;
}
@font-face {
  font-family:'Noto Sans SC';
  src:url('assets/fonts/NotoSansSC-VF.ttf') format('truetype');
  font-weight:100 900; font-display:block;
}
@font-face {
  font-family:'JetBrains Mono';
  src:url('assets/fonts/JetBrainsMono-VF.ttf') format('truetype');
  font-weight:100 800; font-display:block;
}


* { box-sizing:border-box; }
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
#root { position:absolute; inset:0; overflow:hidden; font-family:'Noto Sans SC',sans-serif; }

/* 背景 */
.bg-ink { background:#0F1E2E; color:#F3F6F8; }
.bg-paper { background:#EDF0EE; color:#0F1E2E; }
.grid-bg {
  background-image:
    linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px);
  background-size:77px 77px;
}

/* 顶栏 */
.bar {
  position:absolute; left:115px; right:115px; top:73px;
  display:flex; justify-content:space-between; align-items:center; gap:24px;
}
.logo { font-family:'Noto Sans SC',sans-serif; font-weight:900; font-size:40px; letter-spacing:.02em; white-space:nowrap; }
.logo .logo-main { color:inherit; }
.logo b { background:#FFD23F; color:#0F1E2E; padding:0 9px; margin-left:3px; }
.bg-paper .logo b { background:#0F1E2E; color:#FFD23F; }
.bar .src {
  font-family:'JetBrains Mono',monospace; font-size:27px; letter-spacing:.05em;
  opacity:.62; white-space:nowrap; overflow:hidden;
}
.bar .cnt { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:36px; letter-spacing:.04em; white-space:nowrap; }
.bar .cnt i { font-style:normal; opacity:.45; }

/* 标签 chip */
.chip {
  display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:29px;
  letter-spacing:.08em; padding:7px 21px; background:#FFD23F; color:#0F1E2E;
}
.chip.dk { background:#0F1E2E; color:#F3F6F8; }
.chip.ol { background:transparent; color:#FFD23F; box-shadow:inset 0 0 0 3px #FFD23F; }
.chip.dk.ol { background:transparent; color:#0F1E2E; box-shadow:inset 0 0 0 3px #0F1E2E; }

/* 荧光笔（关键词） */
.hl-word { position:relative; display:inline-block; white-space:nowrap; }
.hl-bg {
  position:absolute; inset:0; z-index:0;
  background:linear-gradient(transparent 52%, #FFD23F 52% 94%, transparent 94%);
  transform-origin:left center;
}
.hl-text { position:relative; z-index:1; }

/* 硬边卡片 */
.hard {
  border:4.8px solid #0F1E2E; background:#fff;
  box-shadow:17px 17px 0 #0F1E2E;
}

/* 底部进度条 */
.prog {
  position:absolute; left:0; right:0; bottom:0; height:19px;
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
}
.prog i { background:rgba(15,30,46,.16); }
.prog i.on { background:#0F1E2E; }
.prog i.cur { background:#FFD23F; box-shadow:inset 0 -4px 0 #0F1E2E; }
.bg-ink .prog i { background:rgba(255,255,255,.14); }
.bg-ink .prog i.on { background:#182C41; }
.bg-ink .prog i.cur { background:#FFD23F; box-shadow:inset 0 -4px 0 #0F1E2E; }


#root {
  background:#0F1E2E; color:#fff;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px);
  background-size:54px 54px;
}

.waves {
  position:absolute; right:-432px; top:70%; width:1620px; aspect-ratio:1;
  border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 30px,rgba(58,116,255,.7) 30px 32px);
  -webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);
  mask-image:radial-gradient(circle,#000 18%,transparent 68%);
}

.c-top { position:absolute; left:86px; top:65px; right:86px;
  display:flex; justify-content:space-between; align-items:center; }
.c-top .chip { font-size:43px; padding:11px 32px; }
.c-top .logo { font-size:54px; }
.c-top .logo b { padding:0 13px; margin-left:9px; }

.cv-title { position:absolute; left:86px; right:86px; top:324px; }
.cv-title .a { font-family:'ZCOOL QingKe HuangYou',sans-serif; font-size:292px; line-height:1.02; }
.cv-title .b { display:inline-block; background:#FFD23F; color:#0F1E2E;
  font-family:'ZCOOL QingKe HuangYou',sans-serif; font-size:367px; line-height:1;
  padding:0 43px 22px; margin-top:22px; }
.cv-title .s { margin-top:86px; font-weight:700; font-size:65px; line-height:1.45; }

.cv-stamp { position:absolute; left:86px; bottom:216px;
  font-family:'JetBrains Mono',monospace; font-weight:700; color:#FFD23F; font-size:173px; line-height:1; }
.cv-stamp small { display:block; font-size:48px; color:#F3F6F8;
  font-family:'Noto Sans SC',sans-serif; margin-top:22px; font-weight:500; }

.ticker { position:absolute; left:0; right:0; bottom:0; height:119px;
  background:#FFD23F; color:#0F1E2E; display:flex; align-items:center;
  white-space:nowrap; overflow:hidden;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:43px; letter-spacing:.14em; }
.ticker span { padding-left:30px; }

</style>
<div id="root" class="bg" data-composition-id="cover-v" data-width="1080"
     data-height="1920" data-duration="3.5">

<div class="waves"></div>
<div class="c-top">
  <span class="chip">AI 科技周报</span>
  <span class="logo"><span class="logo-main">AI</span><b>周见</b></span>
</div>
<div class="cv-title">
  <div class="a">AI</div>
  <div class="b">周见</div>
  <div class="s">每期 3–10 条，盘点一周值得关注的 AI 科技</div>
</div>
<div class="cv-stamp">10.10
  <small>周六 · 本周 5 条 · 第 1 期</small>
</div>
<div class="ticker"><span>本周热点 · 模型 · 产品 · 融资 · 政策 · 开源 · 本周热点 · 模型 · 产品 · 融资 · 政策 · 开源 · </span></div>

</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>

const root = document.querySelector('[data-composition-id="cover-v"]');
const q = (s) => root.querySelectorAll(s);
const tl = gsap.timeline({paused:true});

tl.set(q('.waves'), {scale:.98}, 0);
tl.set(q('.c-top'), {autoAlpha:0, y:-20}, 0);
tl.set(q('.cv-title .a'), {autoAlpha:0, y:40}, 0);
tl.set(q('.cv-title .b'), {autoAlpha:0, y:40}, 0);
tl.set(q('.cv-title .s'), {autoAlpha:0, y:24}, 0);
tl.set(q('.cv-stamp'), {autoAlpha:0, y:24}, 0);
tl.set(q('.ticker'), {yPercent:100}, 0);

tl.to(q('.c-top'), {autoAlpha:1, y:0, duration:0.5, ease:'power3.out'}, 0);
tl.to(q('.cv-title .a'), {autoAlpha:1, y:0, duration:0.5, ease:'power3.out'}, 0.2);
tl.to(q('.cv-title .b'), {autoAlpha:1, y:0, duration:0.5, ease:'power3.out'}, 0.35);
tl.to(q('.cv-title .s'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.6);
tl.to(q('.cv-stamp'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.7);
tl.to(q('.waves'), {scale:1.05, duration:3, ease:'sine.inOut'}, 0.2);
tl.to(q('.ticker'), {yPercent:0, duration:0.4, ease:'power3.out'}, 0.8);
tl.to(q('.ticker span'), {x:-140, duration:2.3, ease:'none'}, 1.0);

window.__timelines['cover-v'] = tl;

</script>
</template>
</body>
</html>
