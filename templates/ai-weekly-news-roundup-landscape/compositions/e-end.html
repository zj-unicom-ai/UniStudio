<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
</head>
<body>
<template>
<style>

@font-face {
  font-family:'ZCOOL QingKe HuangYou';
  src:url('assets/fonts/ZCOOLQingKeHuangYou-Regular.ttf') format('truetype');
  font-weight:400; font-display:block;
}
@font-face {
  font-family:'Noto Sans SC';
  src:url('assets/fonts/NotoSansSC-VF.ttf') format('truetype');
  font-weight:100 900; font-display:block;
}
@font-face {
  font-family:'JetBrains Mono';
  src:url('assets/fonts/JetBrainsMono-VF.ttf') format('truetype');
  font-weight:100 800; font-display:block;
}


* { box-sizing:border-box; }
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
#root { position:absolute; inset:0; overflow:hidden; font-family:'Noto Sans SC',sans-serif; }

/* 背景 */
.bg-ink { background:#0F1E2E; color:#F3F6F8; }
.bg-paper { background:#EDF0EE; color:#0F1E2E; }
.grid-bg {
  background-image:
    linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px);
  background-size:77px 77px;
}

/* 顶栏 */
.bar {
  position:absolute; left:115px; right:115px; top:73px;
  display:flex; justify-content:space-between; align-items:center; gap:24px;
}
.logo { font-family:'Noto Sans SC',sans-serif; font-weight:900; font-size:40px; letter-spacing:.02em; white-space:nowrap; }
.logo .logo-main { color:inherit; }
.logo b { background:#FFD23F; color:#0F1E2E; padding:0 9px; margin-left:3px; }
.bg-paper .logo b { background:#0F1E2E; color:#FFD23F; }
.bar .src {
  font-family:'JetBrains Mono',monospace; font-size:27px; letter-spacing:.05em;
  opacity:.62; white-space:nowrap; overflow:hidden;
}
.bar .cnt { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:36px; letter-spacing:.04em; white-space:nowrap; }
.bar .cnt i { font-style:normal; opacity:.45; }

/* 标签 chip */
.chip {
  display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:29px;
  letter-spacing:.08em; padding:7px 21px; background:#FFD23F; color:#0F1E2E;
}
.chip.dk { background:#0F1E2E; color:#F3F6F8; }
.chip.ol { background:transparent; color:#FFD23F; box-shadow:inset 0 0 0 3px #FFD23F; }
.chip.dk.ol { background:transparent; color:#0F1E2E; box-shadow:inset 0 0 0 3px #0F1E2E; }

/* 荧光笔（关键词） */
.hl-word { position:relative; display:inline-block; white-space:nowrap; }
.hl-bg {
  position:absolute; inset:0; z-index:0;
  background:linear-gradient(transparent 52%, #FFD23F 52% 94%, transparent 94%);
  transform-origin:left center;
}
.hl-text { position:relative; z-index:1; }

/* 硬边卡片 */
.hard {
  border:4.8px solid #0F1E2E; background:#fff;
  box-shadow:17px 17px 0 #0F1E2E;
}

/* 底部进度条 */
.prog {
  position:absolute; left:0; right:0; bottom:0; height:19px;
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
}
.prog i { background:rgba(15,30,46,.16); }
.prog i.on { background:#0F1E2E; }
.prog i.cur { background:#FFD23F; box-shadow:inset 0 -4px 0 #0F1E2E; }
.bg-ink .prog i { background:rgba(255,255,255,.14); }
.bg-ink .prog i.on { background:#182C41; }
.bg-ink .prog i.cur { background:#FFD23F; box-shadow:inset 0 -4px 0 #0F1E2E; }


#root { background:#0F1E2E; color:#fff;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px);
  background-size:77px 77px;
}

/* 左侧 */
.e-main { position:absolute; left:115px; top:240px; }
.e-main h4 {
  margin:35px 0 0; font-family:'ZCOOL QingKe HuangYou',sans-serif; font-weight:400;
  font-size:184px; line-height:1.05;
}
.e-main h4 .e-line { display:block; }
.e-main h4 .hl { background:#FFD23F; color:#0F1E2E; padding:0 19px 7px; }
.e-main p { margin-top:58px; font-size:48px; font-weight:700; }
.e-main .m {
  margin-top:19px; font-family:'JetBrains Mono',monospace; font-size:31px;
  color:#8A98A6; letter-spacing:.06em;
}

/* 右侧回顾 */
.e-recap {
  position:absolute; right:115px; top:250px; width:691px;
  border:4.8px solid rgba(255,255,255,.28);
  padding:42px 50px;
}
.e-recap .t { font-family:'JetBrains Mono',monospace; font-size:27px; letter-spacing:.1em; color:#FFD23F; }
.e-recap ol {
  list-style:none; margin:23px 0 0; padding:0;
  display:flex; flex-direction:column; gap:21px;
}
.e-recap li { display:flex; gap:27px; font-size:36px; font-weight:500; line-height:1.45; align-items:baseline; }
.e-recap li b { font-family:'JetBrains Mono',monospace; color:#FFD23F; flex:none; }

</style>
<div id="root" class="bg" data-composition-id="e-end" data-width="1920"
     data-height="1080" data-duration="10.3">

<div class="bar">
  <span class="logo"><span class="logo-main">AI</span><b>周见</b></span>
  <span class="src">10.10 周六</span>
</div>

<div class="e-main">
  <span class="chip">本周收尾</span>
  <h4>
    <span class="e-line">本周就</span>
    <span class="e-line">盘到<span class="hl">这儿</span></span>
  </h4>
  <p>每周一见，看见 AI 的下一步。</p>
  <div class="m">点关注，不错过每周的 AI 科技盘点</div>
</div>


<div class="e-recap">
  <div class="t">一句话回顾</div>
  <ol><li><b>01</b><span>新一代推理模型，长任务更稳</span></li><li><b>02</b><span>会议纪要成为办公软件标配</span></li><li><b>03</b><span>开源小模型也能打</span></li><li><b>04</b><span>融资继续流向应用层</span></li><li><b>05</b><span>地方政策开始扶持 AI 应用</span></li></ol>
</div>

<div class="prog" style="grid-template-columns:repeat(5,1fr)"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>

</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>

const root = document.querySelector('[data-composition-id="e-end"]');
const q = (s) => root.querySelectorAll(s);
const tl = gsap.timeline({paused:true});

tl.set(q('.bar'), {autoAlpha:0, y:-20}, 0);
tl.set(q('.prog'), {autoAlpha:0}, 0);
tl.set(q('.e-main .chip'), {autoAlpha:0, y:24}, 0);
tl.set(q('.e-main h4 .e-line'), {autoAlpha:0, y:24}, 0);
tl.set(q('.e-main p'), {autoAlpha:0, y:24}, 0);
tl.set(q('.e-main .m'), {autoAlpha:0, y:24}, 0);
tl.set(q('.e-recap li'), {autoAlpha:0, y:24}, 0);
tl.set(q('.e-recap .t'), {autoAlpha:0}, 0);

tl.to(q('.bar'), {autoAlpha:1, y:0, duration:0.5, ease:'power3.out'}, 0.3);
tl.to(q('.prog'), {autoAlpha:1, duration:0.4, ease:'power2.out'}, 0.4);
tl.to(q('.e-main .chip'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.3);
tl.to(q('.e-main h4 .e-line:nth-child(1)'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.5);
tl.to(q('.e-main h4 .e-line:nth-child(2)'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.5800000000000001);
tl.to(q('.e-main p'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.8);
tl.to(q('.e-main .m'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.8999999999999999);
tl.to(q('.e-recap .t'), {autoAlpha:1, duration:0.4, ease:'power3.out'}, 1.2);
tl.to(q('.e-recap li:nth-child(1)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 1.3);
tl.to(q('.e-recap li:nth-child(2)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 1.45);
tl.to(q('.e-recap li:nth-child(3)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 1.6);
tl.to(q('.e-recap li:nth-child(4)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 1.75);
tl.to(q('.e-recap li:nth-child(5)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 1.9);

window.__timelines['e-end'] = tl;

</script>
</template>
</body>
</html>
