<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
</head>
<body>
<template>
<style>

@font-face {
  font-family:'ZCOOL QingKe HuangYou';
  src:url('assets/fonts/ZCOOLQingKeHuangYou-Regular.ttf') format('truetype');
  font-weight:400; font-display:block;
}
@font-face {
  font-family:'Noto Sans SC';
  src:url('assets/fonts/NotoSansSC-VF.ttf') format('truetype');
  font-weight:100 900; font-display:block;
}
@font-face {
  font-family:'JetBrains Mono';
  src:url('assets/fonts/JetBrainsMono-VF.ttf') format('truetype');
  font-weight:100 800; font-display:block;
}


* { box-sizing:border-box; }
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
#root { position:absolute; inset:0; overflow:hidden; font-family:'Noto Sans SC',sans-serif; }

/* 背景 */
.bg-ink { background:#0F1E2E; color:#F3F6F8; }
.bg-paper { background:#EDF0EE; color:#0F1E2E; }
.grid-bg {
  background-image:
    linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px);
  background-size:77px 77px;
}

/* 顶栏 */
.bar {
  position:absolute; left:115px; right:115px; top:73px;
  display:flex; justify-content:space-between; align-items:center; gap:24px;
}
.logo { font-family:'Noto Sans SC',sans-serif; font-weight:900; font-size:40px; letter-spacing:.02em; white-space:nowrap; }
.logo .logo-main { color:inherit; }
.logo b { background:#FFD23F; color:#0F1E2E; padding:0 9px; margin-left:3px; }
.bg-paper .logo b { background:#0F1E2E; color:#FFD23F; }
.bar .src {
  font-family:'JetBrains Mono',monospace; font-size:27px; letter-spacing:.05em;
  opacity:.62; white-space:nowrap; overflow:hidden;
}
.bar .cnt { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:36px; letter-spacing:.04em; white-space:nowrap; }
.bar .cnt i { font-style:normal; opacity:.45; }

/* 标签 chip */
.chip {
  display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:29px;
  letter-spacing:.08em; padding:7px 21px; background:#FFD23F; color:#0F1E2E;
}
.chip.dk { background:#0F1E2E; color:#F3F6F8; }
.chip.ol { background:transparent; color:#FFD23F; box-shadow:inset 0 0 0 3px #FFD23F; }
.chip.dk.ol { background:transparent; color:#0F1E2E; box-shadow:inset 0 0 0 3px #0F1E2E; }

/* 荧光笔（关键词） */
.hl-word { position:relative; display:inline-block; white-space:nowrap; }
.hl-bg {
  position:absolute; inset:0; z-index:0;
  background:linear-gradient(transparent 52%, #FFD23F 52% 94%, transparent 94%);
  transform-origin:left center;
}
.hl-text { position:relative; z-index:1; }

/* 硬边卡片 */
.hard {
  border:4.8px solid #0F1E2E; background:#fff;
  box-shadow:17px 17px 0 #0F1E2E;
}

/* 底部进度条 */
.prog {
  position:absolute; left:0; right:0; bottom:0; height:19px;
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
}
.prog i { background:rgba(15,30,46,.16); }
.prog i.on { background:#0F1E2E; }
.prog i.cur { background:#FFD23F; box-shadow:inset 0 -4px 0 #0F1E2E; }
.bg-ink .prog i { background:rgba(255,255,255,.14); }
.bg-ink .prog i.on { background:#182C41; }
.bg-ink .prog i.cur { background:#FFD23F; box-shadow:inset 0 -4px 0 #0F1E2E; }


#root { background:#0F1E2E; color:#fff;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px);
  background-size:77px 77px;
}

/* 左侧 */
.a-left { position:absolute; left:115px; top:230px; }
.a-left h4 {
  margin:31px 0 0; font-family:'ZCOOL QingKe HuangYou',sans-serif; font-weight:400;
  font-size:173px; line-height:1.02;
}
.a-left h4 .a-line { display:block; }
.a-left .m {
  margin-top:58px; font-family:'JetBrains Mono',monospace; font-size:31px;
  color:#8A98A6; letter-spacing:.08em; line-height:1.9;
}
.a-left .m .m-line { display:block; }

/* 右侧列表 */
.a-list {
  position:absolute; right:115px; top:202px; width:998px;
  display:flex; flex-direction:column;
}
.a-row {
  display:grid; grid-template-columns:81px 169px 1fr;
  align-items:center; gap:23px;
  padding:30px 31px;
  border-bottom:3px solid rgba(255,255,255,.16);
  font-size:43px; font-weight:700;
}
.a-row .n { font-family:'JetBrains Mono',monospace; font-weight:700; color:#FFD23F; font-size:42px; }
.a-row .chip {
  width:100%; text-align:center; font-size:25px; padding:6px 0;
}
.a-row .tt { overflow:hidden; }
.a-row.first { background:#FFD23F; color:#0F1E2E; border-bottom-color:#FFD23F; }
.a-row.first .n { color:#0F1E2E; }
.a-row.first .chip { background:#0F1E2E; color:#FFD23F; box-shadow:none; }

</style>
<div id="root" class="bg" data-composition-id="a-toc" data-width="1920"
     data-height="1080" data-duration="8.3">

<div class="bar">
  <span class="logo"><span class="logo-main">AI</span><b>周见</b></span>
  <span class="src">10.10 周六</span>
</div>

<div class="a-left">
  <span class="chip">本周目录</span>
  <h4><span class="a-line">本周</span><span class="a-line">盘点 5 条</span></h4>
  <div class="m">
    <span class="m-line">预计时长 02:22</span>
  </div>
</div>

<div class="a-list"><div class="a-row first"><span class="n">01</span><span class="chip">模型发布</span><span class="tt">某公司发布新一代推理模型</span></div><div class="a-row"><span class="n">02</span><span class="chip ol">产品</span><span class="tt">办公软件上线 AI 会议纪要</span></div><div class="a-row"><span class="n">03</span><span class="chip ol">开源</span><span class="tt">开源小模型登顶本周榜单</span></div><div class="a-row"><span class="n">04</span><span class="chip ol">融资</span><span class="tt">AI 创业公司完成新一轮融资</span></div><div class="a-row"><span class="n">05</span><span class="chip ol">政策</span><span class="tt">多地出台 AI 应用扶持办法</span></div></div>
<div class="prog" style="grid-template-columns:repeat(5,1fr)"><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div>

</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>

const root = document.querySelector('[data-composition-id="a-toc"]');
const q = (s) => root.querySelectorAll(s);
const tl = gsap.timeline({paused:true});

tl.set(q('.bar'), {autoAlpha:0, y:-20}, 0);
tl.set(q('.prog'), {autoAlpha:0}, 0);
tl.set(q('.a-left .chip'), {autoAlpha:0, y:24}, 0);
tl.set(q('.a-left h4 .a-line'), {autoAlpha:0, y:24}, 0);
tl.set(q('.a-left .m'), {autoAlpha:0, y:24}, 0);
tl.set(q('.a-row'), {autoAlpha:0, y:24}, 0);

tl.to(q('.bar'), {autoAlpha:1, y:0, duration:0.5, ease:'power3.out'}, 0.3);
tl.to(q('.prog'), {autoAlpha:1, duration:0.4, ease:'power2.out'}, 0.4);
tl.to(q('.a-left .chip'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.3);
tl.to(q('.a-left h4 .a-line:nth-child(1)'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.5);
tl.to(q('.a-left h4 .a-line:nth-child(2)'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.5800000000000001);
tl.to(q('.a-left .m'), {autoAlpha:1, y:0, duration:0.45, ease:'power3.out'}, 0.7);
tl.to(q('.a-row:nth-child(1)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 0.7);
tl.to(q('.a-row:nth-child(2)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 0.8);
tl.to(q('.a-row:nth-child(3)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 0.9);
tl.to(q('.a-row:nth-child(4)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 1.0);
tl.to(q('.a-row:nth-child(5)'), {autoAlpha:1, y:0, duration:0.4, ease:'power3.out'}, 1.1);

window.__timelines['a-toc'] = tl;

</script>
</template>
</body>
</html>
