<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniStudio · 创作工作室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%230B0F14'/%3E%3Cpath d='M28 20V62a32 32 0 0 0 64 0V20' fill='none' stroke='%23F4F6FA' stroke-width='18' stroke-linecap='round'/%3E%3Ccircle cx='60' cy='38' r='10' fill='%23B6F23A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink-900:#0B0F14; --ink-800:#121821; --ink-700:#1A2230; --ink-600:#263041;
  --slate-500:#5A6678; --slate-400:#8C98AB; --mist-200:#DDE2EA; --paper-50:#F4F6FA;
  --blue:#3B5BFF; --blue-300:#8AA0FF; --blue-700:#2640D9;
  --green:#B6F23A; --green-700:#1F7A2E;
  --amber:#FFB224; --red:#FF5D5D;
  --panel:#0E131A; --side:#121821;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r-label:6px; --r-input:10px; --r-card:16px; --r-panel:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--ink-900); color:var(--paper-50);
  padding:16px; -webkit-font-smoothing:antialiased;
}
.font-display{font-family:"Space Grotesk","Noto Sans SC",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; letter-spacing:.02em}
::selection{background:rgba(59,91,255,.35)}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
a{color:var(--blue-300); text-decoration:none}
h1,h2,h3,h4{font-weight:700}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 应用外壳 ============ */
.app{
  height:calc(100vh - 32px);
  display:flex; overflow:hidden;
  background:var(--panel);
  border:1px solid var(--ink-600);
  border-radius:var(--r-panel);
}
/* ============ 侧边栏 ============ */
.sidebar{
  width:232px; flex-shrink:0;
  background:var(--side);
  border-right:1px solid var(--ink-600);
  display:flex; flex-direction:column;
  padding:20px 14px;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px}
.brand .logo-mark{width:30px;height:30px;flex-shrink:0;overflow:visible}
.logo-mark path.u{stroke:var(--paper-50); fill:none;stroke-width:18;stroke-linecap:round}
.logo-mark .dot{
  fill:var(--green);
  transform-box:fill-box; transform-origin:center;
  animation:logoDot 2.8s ease-in-out infinite;
  filter:drop-shadow(0 0 2.5px rgba(182,242,58,.55));
}
.logo-mark .dot-halo{
  fill:none; stroke:var(--green); stroke-width:3.5;
  transform-box:fill-box; transform-origin:center;
  animation:logoHalo 2.8s cubic-bezier(.25,.6,.35,1) infinite;
}
.logo-mark .dot-halo.h2{animation-delay:-1.4s}
@keyframes logoDot{
  0%,100%{transform:scale(1)}
  50%{transform:scale(.78)}
}
@keyframes logoHalo{
  0%{transform:scale(1);opacity:.55}
  75%,100%{transform:scale(2.5);opacity:0}
}
.brand:hover .logo-mark .dot{animation:logoDot 2.8s ease-in-out infinite,logoDotPop .55s var(--ease)}
.brand:hover .logo-mark .dot-halo{animation-duration:1.2s}
.brand:hover .logo-mark .dot-halo.h2{animation-delay:-.6s}
@keyframes logoDotPop{
  0%{transform:scale(1)}
  35%{transform:scale(1.4)}
  65%{transform:scale(.88)}
  100%{transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){
  .logo-mark .dot,.logo-mark .dot-halo{animation:none}
}
.brand .brand-name{font-family:"Space Grotesk","Noto Sans SC",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-item{
  display:flex; align-items:center; gap:12px;
  width:100%; padding:10px 12px;
  border-radius:var(--r-input);
  color:var(--slate-400); font-size:14px; font-weight:500;
  text-align:left;
  transition:background .12s var(--ease),color .12s var(--ease);
}
.side-item svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.side-item:hover{background:rgba(255,255,255,.04);color:var(--paper-50)}
.side-item.active{background:rgba(59,91,255,.16);color:var(--blue-300)}
.side-item.active svg{color:var(--blue-300)}
.side-spacer{flex:1}
.side-foot{
  margin-top:12px; padding:14px;
  border:1px solid var(--ink-600); border-radius:var(--r-card);
  background:rgba(182,242,58,.05);
}
.side-foot .sf-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.side-foot .sf-dots{display:flex;gap:5px}
.side-foot .sf-dots i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.side-foot .sf-sub{margin-top:6px;font-size:11px;color:var(--slate-400);font-family:"JetBrains Mono",monospace}
/* 在岗灯呼吸 */
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.78)}}
.tally{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);animation:breathe 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tally{animation:none}}

/* ============ 主区域 ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view-header{
  flex-shrink:0;
  display:flex;align-items:center;gap:16px;
  padding:18px 28px;
  border-bottom:1px solid var(--ink-600);
  min-height:70px;
}
.vh-left{display:flex;align-items:center;gap:12px;min-width:0}
.vh-title{font-size:22px;font-weight:700;white-space:nowrap}
.vh-date{font-size:12px;color:var(--slate-400);white-space:nowrap}
.vh-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.menu-btn{display:none;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid var(--ink-600);border-radius:var(--r-input)}
.menu-btn svg{width:18px;height:18px;stroke:var(--paper-50);fill:none;stroke-width:1.75;stroke-linecap:round}
.view-body{flex:1;overflow-y:auto;padding:26px 28px 40px}
.view-body .wrap{max-width:1160px;margin:0 auto}

/* ============ 通用组件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:var(--r-input);
  font-size:14px;font-weight:700;
  transition:background .12s var(--ease),border-color .12s var(--ease),transform .12s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-700)}
.btn-ghost{background:transparent;color:var(--paper-50);border:1px solid var(--ink-600)}
.btn-ghost:hover{border-color:var(--slate-400);background:rgba(255,255,255,.03)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--r-label)}
.tabs{display:flex;gap:4px;background:var(--ink-800);border:1px solid var(--ink-600);border-radius:var(--r-input);padding:3px}
.tab{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:500;color:var(--slate-400);transition:all .12s var(--ease)}
.tab:hover{color:var(--paper-50)}
.tab.active{background:var(--paper-50);color:var(--ink-900);font-weight:700}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--r-label);
  border:1px solid var(--ink-600);background:var(--ink-800);
  font-size:13px;color:var(--slate-400);
  transition:all .12s var(--ease);
}
.chip:hover{border-color:var(--slate-400);color:var(--paper-50)}
.chip.active{background:rgba(59,91,255,.16);border-color:var(--blue);color:var(--blue-300)}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:var(--r-label);
  font-size:11px;font-weight:500;line-height:1.5;
}
.tag.mono{font-family:"JetBrains Mono",monospace}
.tag-blue{background:rgba(59,91,255,.18);color:var(--blue-300)}
.tag-green{background:rgba(182,242,58,.16);color:var(--green)}
.tag-amber{background:rgba(255,178,36,.16);color:var(--amber)}
.tag-red{background:rgba(255,93,93,.16);color:var(--red)}
.tag-slate{background:rgba(140,152,171,.16);color:var(--slate-400)}
.card{border:1px solid var(--ink-600);border-radius:var(--r-card);background:var(--ink-700)}
.kicker{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--blue-300);font-family:"JetBrains Mono",monospace;text-transform:uppercase}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.section-head h2{font-size:18px}
.section-head .sh-sub{font-size:12px;color:var(--slate-400)}
.section-head .sh-count{margin-left:auto;font-size:12px;color:var(--slate-400)}

/* 取景框角标 */
.vf{position:relative}
.vf::before,.vf::after{
  content:"";position:absolute;width:22px;height:22px;
  border:2px solid var(--green);
}
.vf::before{top:-10px;left:-10px;border-right:none;border-bottom:none}
.vf::after{bottom:-10px;right:-10px;border-left:none;border-top:none}

/* ============ 首页 ============ */
.home-hero{
  display:grid;grid-template-columns:1.5fr 1fr;gap:36px;
  border:1px solid var(--ink-600);border-radius:var(--r-panel);
  background:var(--ink-800);
  padding:38px 40px;
  margin-bottom:24px;
}
.home-hero .hh-kicker{margin-bottom:18px}
.home-hero h1{
  font-size:48px;line-height:1.15;font-weight:900;letter-spacing:0;
}
.home-hero h1 .green{color:var(--green)}
.home-hero .hh-lede{margin-top:18px;font-size:15px;line-height:1.8;color:var(--mist-200);max-width:520px}
.home-hero .hh-actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.onair-panel{
  position:relative;
  border:1px solid var(--ink-600);border-radius:var(--r-card);
  background:var(--ink-900);
  padding:20px;
  display:flex;flex-direction:column;
}
.onair-top{display:flex;align-items:center;gap:8px;font-size:12px;font-family:"JetBrains Mono",monospace;color:var(--slate-400)}
.onair-247{margin:22px 0 6px;font-family:"Space Grotesk",sans-serif;font-size:64px;font-weight:700;line-height:1;letter-spacing:-.02em}
.onair-247 .slash{color:var(--green)}
.onair-sub{font-size:12px;color:var(--slate-400)}
.onair-foot{margin-top:auto;padding-top:22px}
.pipe-segs{display:flex;gap:4px;margin-bottom:8px}
.pipe-segs i{height:4px;flex:1;border-radius:2px;background:var(--green)}
.pipe-segs i.blue{background:var(--blue)}
.pipe-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--slate-400);font-family:"JetBrains Mono",monospace}
.onair-footrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.onair-footrow .mono{font-size:11px;color:var(--mist-200)}

/* 统计卡 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{padding:18px 20px;border:1px solid var(--ink-600);border-radius:var(--r-card);background:var(--ink-700)}
.stat-card .sc-label{font-size:12px;color:var(--slate-400);margin-bottom:10px}
.stat-card .sc-num{font-family:"Space Grotesk",sans-serif;font-size:32px;font-weight:700;line-height:1}
.stat-card .sc-num.green{color:var(--green)}
.stat-card .sc-num.amber{color:var(--amber)}
.stat-card .sc-num.blue{color:var(--blue-300)}
.stat-card .sc-num .sc-unit{margin-left:8px;font-family:inherit;font-size:12px;font-weight:400;color:var(--slate-400)}
.stat-card .sc-platform{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.stat-card .sc-platform .ok{font-size:12px;color:var(--slate-400);font-weight:400}

/* 能力卡 */
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.cap-card{padding:22px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s var(--ease)}
.cap-card:hover{border-color:var(--slate-400)}
.cap-icon{width:42px;height:42px;border-radius:var(--r-input);background:rgba(59,91,255,.14);display:flex;align-items:center;justify-content:center}
.cap-icon svg{width:21px;height:21px;stroke:var(--blue-300);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.cap-card h3{font-size:16px}
.cap-card p{font-size:13px;line-height:1.7;color:var(--slate-400)}
.cap-card .cap-link{margin-top:auto;font-size:13px;font-weight:700;color:var(--blue-300)}
.cap-card .cap-meta{font-size:11px;color:var(--slate-500);font-family:"JetBrains Mono",monospace}

/* 工作流步骤 */
.flow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:8px}
.flow-step{position:relative;padding-top:14px}
.flow-step::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--blue);border-radius:2px}
.flow-step:last-child::before{background:var(--green)}
.flow-step .fs-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--ink-700);border:1px solid var(--ink-600);font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--blue-300);margin-bottom:12px}
.flow-step h4{font-size:14px;margin-bottom:6px}
.flow-step p{font-size:12px;color:var(--slate-400);line-height:1.6}

/* ============ 模板视图 ============ */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.filter-bar .search-box{margin-left:auto;position:relative;min-width:220px}
.filter-bar .search-box input{
  width:100%;padding:9px 14px 9px 36px;
  background:var(--ink-800);border:1px solid var(--ink-600);border-radius:var(--r-input);
  color:var(--paper-50);font-size:13px;outline:none;
}
.filter-bar .search-box input:focus{border-color:var(--blue)}
.filter-bar .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--slate-400);fill:none;stroke-width:1.75}
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:36px}
.tpl-card{overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s var(--ease)}
.tpl-card:hover{border-color:var(--slate-400)}
.tpl-cover{position:relative;aspect-ratio:9/16;overflow:hidden;background:var(--ink-800)}
.tpl-cover img{width:100%;height:100%;object-fit:cover;display:block}
.tpl-cover .sample-btn{
  position:absolute;right:10px;bottom:10px;
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:var(--r-label);
  background:rgba(11,15,20,.72);
  border:1px solid rgba(255,255,255,.15);
  font-size:11px;font-weight:500;
}
.tpl-cover .sample-btn svg{width:11px;height:11px;fill:currentColor;stroke:none}
.tpl-info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tpl-tags{display:flex;flex-wrap:wrap;gap:5px}
.tpl-info h3{font-size:15px}
.tpl-info .tpl-en{font-family:"Space Grotesk",sans-serif;font-size:11px;color:var(--slate-500);margin-top:-4px}
.tpl-info p{font-size:12px;line-height:1.7;color:var(--slate-400);flex:1}
.tpl-specs{font-size:11px;color:var(--slate-400);font-family:"JetBrains Mono",monospace}
.tpl-actions{display:flex;gap:8px;flex-wrap:wrap}
.tpl-actions .btn-sm{flex:1}

/* 画幅分段筛选器 */
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--ink-600);border-radius:var(--r-card);background:var(--ink-800)}
.seg-btn{
  padding:7px 15px;border-radius:7px;border:none;background:transparent;
  font-size:13px;color:var(--slate-400);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.seg-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.seg-btn:hover{color:var(--mist-200)}
.seg-btn.active{background:var(--ink-600);color:var(--paper-50)}

/* 模板分组区块 */
.tpl-section{margin-bottom:6px}
.tpl-section .section-head{margin-bottom:14px}
.tpl-section .sh-dot{width:7px;height:7px;border-radius:50%;background:var(--slate-400)}
.tpl-section.sh-v .sh-dot{background:var(--blue)}
.tpl-section.sh-h .sh-dot{background:var(--signal)}

/* 横屏模板：横向卡片（左 16:9 封面，右信息） */
.tpl-grid-h{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:36px}
.tpl-card-h{display:flex;flex-direction:row;gap:18px;padding:14px;transition:border-color .15s var(--ease)}
.tpl-card-h:hover{border-color:var(--slate-400)}
.tpl-card-h .tpl-cover-h{
  width:300px;flex-shrink:0;aspect-ratio:16/9;position:relative;
  overflow:hidden;border-radius:10px;background:var(--ink-800);
  border:1px solid var(--ink-600);align-self:center;
}
.tpl-card-h .tpl-cover-h img{width:100%;height:100%;object-fit:cover;display:block}
.tpl-card-h .tpl-cover-h .sample-btn{
  position:absolute;right:10px;bottom:10px;
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:var(--r-label);
  background:rgba(11,15,20,.72);border:1px solid rgba(255,255,255,.15);
  font-size:11px;font-weight:500;
}
.tpl-card-h .tpl-cover-h .sample-btn svg{width:11px;height:11px;fill:currentColor;stroke:none}
.tpl-card-h .tpl-info{padding:4px 6px 2px 0;justify-content:center}
.tpl-card-h .tpl-info p{max-width:560px}
.tpl-card-h .tpl-actions{max-width:340px}

/* 规格对比表 */
.cmp-table{width:100%;border-collapse:collapse;font-size:13px;overflow:hidden;border-radius:var(--r-card)}
.cmp-table th,.cmp-table td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--ink-600)}
.cmp-table th{background:var(--ink-800);color:var(--slate-400);font-weight:500;font-size:12px}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table td .mono{font-size:11px;color:var(--slate-500)}
.cmp-table td a{color:var(--blue-300);font-weight:500}

/* ============ 任务看板（成片发布看板） ============ */
.board-toolbar{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:22px;padding:14px 16px;
  border:1px solid var(--ink-600);border-radius:var(--r-card);
  background:rgba(255,255,255,.015);
}
.bf-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bf-label{
  flex:0 0 auto;width:34px;
  font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:500;
  letter-spacing:.18em;color:var(--slate-500);
}
.bchip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:999px;
  border:1px solid var(--ink-600);background:var(--ink-800);
  font-size:12.5px;color:var(--slate-400);transition:all .12s var(--ease);
}
.bchip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.bchip:hover{border-color:var(--slate-400);color:var(--paper-50)}
.bchip.on{background:rgba(59,91,255,.16);border-color:var(--blue);color:var(--paper-50)}
.bchip .bc-n{font-family:"JetBrains Mono",monospace;font-size:10.5px;opacity:.75}
#boardSearch{
  flex:1 1 220px;min-width:170px;
  background:var(--ink-800);border:1px solid var(--ink-600);color:var(--paper-50);
  padding:7px 14px;border-radius:999px;font-size:13px;outline:none;
  font-family:"JetBrains Mono",monospace;
}
#boardSearch::placeholder{color:var(--slate-500);font-family:"Noto Sans SC",sans-serif}
#boardSearch:focus{border-color:var(--blue)}

/* 日期分组 */
.bday{margin-bottom:30px}
.bday-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.bday-head .bd-date{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bday-head .bd-rel{font-size:11px;color:var(--amber);border:1px solid rgba(255,178,36,.45);border-radius:99px;padding:2px 10px;background:rgba(255,178,36,.1)}
.bday-head .bd-n{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--slate-500)}
.bday-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ink-600),transparent)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px}

/* 成片卡片 */
.bcard{
  position:relative;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--ink-700),var(--ink-800));
  border:1px solid var(--ink-600);border-radius:var(--r-card);
  overflow:hidden;transition:transform .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.bcard:hover{transform:translateY(-2px);border-color:var(--slate-400);box-shadow:0 16px 38px -20px rgba(0,0,0,.7)}
.bcard.alert{border-color:rgba(255,93,93,.55);box-shadow:0 0 0 1px rgba(255,93,93,.18)}
.b-rail{display:flex;gap:4px;padding:12px 18px 0}
.b-rail i{flex:1;height:3px;border-radius:99px;background:var(--ink-600);min-width:0}
.b-rail i.on{background:var(--acc)}
.b-rail i.now{animation:breathe 1.9s ease-in-out infinite}
.b-body{padding:13px 18px 15px;display:flex;flex-direction:column;gap:10px}
.b-row1{display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--slate-400);flex-wrap:wrap}
.b-pill{
  padding:3px 10px;border-radius:99px;font-weight:600;font-size:11.5px;
  color:var(--acc);
  background:color-mix(in srgb,var(--acc) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--acc) 34%,transparent);
}
.b-status-toggle{
  border:1px solid var(--ink-600);border-radius:999px;background:var(--ink-900);
  color:var(--paper-50);padding:4px 9px;font-size:11px;line-height:1.2;white-space:nowrap;
}
.b-status-toggle:hover{border-color:var(--blue-300);color:var(--blue-300)}
.b-status-toggle:disabled{opacity:.55;cursor:wait}
.b-plat{padding:2px 8px;border-radius:6px;font-weight:600;font-size:10.5px;letter-spacing:.06em;color:var(--slate-400);border:1px solid var(--ink-600)}
.b-date{margin-left:auto;color:var(--slate-500);font-variant-numeric:tabular-nums}
.b-title{display:flex;align-items:flex-start;gap:10px}
.b-title h4{font-size:17px;line-height:1.32;font-weight:700;flex:1 1 auto;word-break:break-word}
.b-len{flex:0 0 auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--slate-500);border:1px solid var(--ink-600);border-radius:6px;padding:2px 6px;margin-top:2px}
.b-desc{
  margin:0;font-size:13px;line-height:1.62;color:var(--mist-200);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
}
.b-desc.open{-webkit-line-clamp:unset}
.b-tags{display:flex;flex-wrap:wrap;gap:6px}
.b-tag{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--blue-300);background:rgba(59,91,255,.08);border:1px solid rgba(59,91,255,.25);border-radius:6px;padding:1px 8px}
.b-note{
  margin:0;font-size:12px;line-height:1.6;color:var(--slate-400);cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  padding-top:9px;border-top:1px dashed var(--ink-600);
}
.b-note.open{-webkit-line-clamp:unset}
.b-meta{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;margin-top:2px;padding-top:12px;border-top:1px dashed var(--ink-600)}
.b-shot{
  position:relative;width:96px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;cursor:pointer;
  background:var(--ink-900);border:1px solid var(--ink-600);flex:0 0 auto;
}
.b-shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s var(--ease)}
.b-shot:hover img{transform:scale(1.05)}
.b-shot .b-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,9,14,.4);transition:background .2s}
.b-shot:hover .b-play{background:rgba(6,9,14,.18)}
.b-shot .b-play span{
  width:34px;height:34px;border-radius:50%;background:rgba(16,22,34,.85);border:1px solid var(--ink-600);
  display:grid;place-items:center;font-size:12px;color:#fff;padding-left:2px;
}
.b-shot .b-dur{position:absolute;right:4px;bottom:4px;background:rgba(6,9,14,.8);border-radius:4px;padding:1px 6px;font-family:"JetBrains Mono",monospace;font-size:11px;color:#e9edf3}
.b-info{min-width:0}
.b-dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.b-dl dt{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--slate-500);white-space:nowrap}
.b-dl dd{margin:0;word-break:break-all;color:var(--mist-200);line-height:1.7;min-width:0}
.b-dl dd a{color:var(--blue-300);text-decoration:none}
.b-dl dd a:hover{text-decoration:underline}
.b-specs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.b-specs b{font-weight:500;font-size:10.5px;font-family:"JetBrains Mono",monospace;color:var(--slate-500);background:var(--ink-900);border:1px solid var(--ink-600);border-radius:5px;padding:1px 7px}
.b-log{font-size:12.5px;border-top:1px dashed var(--ink-600);padding-top:8px}
.b-log summary{cursor:pointer;color:var(--slate-400);font-size:12px}
.b-log summary code{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--slate-500)}
.b-log table{width:100%;border-collapse:collapse;margin-top:6px}
.b-log td{padding:4px 6px;border-top:1px solid var(--ink-600);font-size:12px;color:var(--slate-400);vertical-align:top}
.b-log td:first-child{white-space:nowrap;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--slate-500)}
.b-log td:nth-child(2){white-space:nowrap;color:var(--mist-200)}
.b-log td:last-child{color:var(--slate-400)}
.b-empty{color:var(--slate-500);padding:44px;text-align:center;border:1px dashed var(--ink-600);border-radius:var(--r-card);margin-top:20px}

/* ============ 发布视图 ============ */
.value-panel{border:1px solid var(--ink-600);border-radius:var(--r-panel);background:var(--ink-700);padding:26px 28px;margin-bottom:24px}
.value-panel h3{font-size:18px;margin-bottom:8px}
.value-panel .vp-lede{font-size:13px;color:var(--slate-400);line-height:1.7;margin-bottom:20px}
.vp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vp-card{padding:16px 18px;border:1px solid var(--ink-600);border-radius:var(--r-card);background:var(--ink-800)}
.vp-card h4{font-size:13px;margin-bottom:6px}
.vp-card p{font-size:12px;color:var(--slate-400);line-height:1.65}
.vp-card .vp-num{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:700;color:var(--green);line-height:1;margin-bottom:6px}
.vp-card .vp-num-label{font-size:12px;color:var(--slate-400)}
.skill-card{border:1px solid var(--ink-600);border-radius:var(--r-panel);background:var(--ink-700);margin-bottom:24px;overflow:hidden}
.skill-head{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--ink-600);flex-wrap:wrap}
.skill-head .skill-id{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:500}
.skill-head .skill-desc{font-size:12px;color:var(--slate-400);flex-basis:100%}
.skill-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.skill-col{padding:20px 24px}
.skill-col:first-child{border-right:1px solid var(--ink-600)}
.skill-col h5{font-size:11px;letter-spacing:.08em;color:var(--slate-500);text-transform:uppercase;margin-bottom:12px;font-family:"JetBrains Mono",monospace;font-weight:500}
.skill-col ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.skill-col li{font-size:12.5px;color:var(--mist-200);line-height:1.6;display:flex;gap:8px}
.skill-col li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:7px}
.skill-col li code{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--blue-300);background:rgba(59,91,255,.12);padding:1px 6px;border-radius:4px}
.skill-foot{padding:14px 24px;border-top:1px solid var(--ink-600);font-size:11px;color:var(--slate-500);font-family:"JetBrains Mono",monospace}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.rule-card{padding:20px 22px;display:flex;gap:14px}
.rule-card .rc-icon{width:38px;height:38px;flex-shrink:0;border-radius:var(--r-input);background:var(--ink-800);border:1px solid var(--ink-600);display:flex;align-items:center;justify-content:center}
.rule-card .rc-icon svg{width:18px;height:18px;stroke:var(--blue-300);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.rule-card h4{font-size:14px;margin-bottom:6px}
.rule-card p{font-size:12px;color:var(--slate-400);line-height:1.7}
.platform-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.rec-table{width:100%;border-collapse:collapse;font-size:13px}
.rec-table th,.rec-table td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--ink-600);vertical-align:top}
.rec-table th{font-size:11px;color:var(--slate-500);font-weight:500;font-family:"JetBrains Mono",monospace}
.rec-table td{font-size:12.5px}
.rec-table td .mono{font-size:11px;color:var(--slate-400)}
.rec-table .note{font-size:11px;color:var(--slate-400);line-height:1.6;max-width:280px}
.coming-panel{border:1px dashed var(--ink-600);border-radius:var(--r-panel);padding:28px;text-align:center;margin-top:28px}
.coming-panel h4{font-size:14px;margin-bottom:8px}
.coming-panel p{font-size:12px;color:var(--slate-400);margin-bottom:16px}
.coming-chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ============ 数字员工 ============ */
.emp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:28px}
.emp-card{padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.emp-top{display:flex;align-items:center;gap:14px}
.emp-avatar{width:48px;height:48px;border-radius:12px;background:rgba(59,91,255,.14);border:1px solid rgba(59,91,255,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emp-avatar svg{width:24px;height:24px;stroke:var(--blue-300);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.emp-name{font-size:15px;font-weight:700}
.emp-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--slate-400)}
.emp-stat{display:flex;gap:20px;padding:12px 14px;background:var(--ink-800);border-radius:var(--r-input);border:1px solid var(--ink-600)}
.emp-stat .es-item .es-num{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700}
.emp-stat .es-item .es-num.green{color:var(--green)}
.emp-stat .es-item .es-num.amber{color:var(--amber)}
.emp-stat .es-item .es-label{font-size:10px;color:var(--slate-500);margin-top:2px}
.emp-duties{list-style:none;display:flex;flex-direction:column;gap:7px}
.emp-duties li{font-size:12px;color:var(--slate-400);line-height:1.6;display:flex;gap:8px}
.emp-duties li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:7px}
.sop-panel{border:1px solid var(--ink-600);border-radius:var(--r-panel);background:var(--ink-700);padding:24px 28px;margin-bottom:24px}
.sop-panel h3{font-size:16px;margin-bottom:4px}
.sop-panel .sop-lede{font-size:12px;color:var(--slate-400);margin-bottom:20px}
.ability-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ability-card{padding:16px 18px;border:1px solid var(--ink-600);border-radius:var(--r-card);background:var(--ink-800)}
.ability-card h4{font-size:13px;margin-bottom:6px}
.ability-card p{font-size:12px;color:var(--slate-400);line-height:1.65}

/* ============ 弹窗 / 灯箱 / Toast ============ */
.modal-mask{position:fixed;inset:0;background:rgba(11,15,20,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-mask.open{display:flex}
.modal{width:560px;max-width:100%;max-height:86vh;overflow-y:auto;background:var(--ink-800);border:1px solid var(--ink-600);border-radius:var(--r-panel);padding:26px 28px}
.modal h3{font-size:17px;margin-bottom:8px}
.modal .m-lede{font-size:12.5px;color:var(--slate-400);line-height:1.7;margin-bottom:18px}
.modal-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.modal-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--ink-600);border-radius:var(--r-input);background:var(--ink-700)}
.modal-row .mr-thumb{width:32px;aspect-ratio:9/16;border-radius:5px;overflow:hidden;background:var(--ink-900);flex-shrink:0}
.modal-row .mr-thumb img{width:100%;height:100%;object-fit:cover}
.modal-row .mr-name{font-size:13px;font-weight:500;flex:1;min-width:0}
.modal-row .mr-name .mr-en{display:block;font-size:10px;color:var(--slate-500);font-family:"Space Grotesk",sans-serif}
.nav-backdrop{position:fixed;inset:0;background:rgba(11,15,20,.6);z-index:50;display:none}
.nav-backdrop.open{display:block}
.lightbox{position:fixed;inset:0;background:rgba(11,15,20,.92);display:none;align-items:center;justify-content:center;z-index:110;padding:24px}
.lightbox.open{display:flex}
.lb-content{max-width:min(480px,92vw);width:100%;position:relative}
.lb-content video,.lb-content img{width:100%;border-radius:var(--r-card);display:block;background:#000}
.lb-close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:var(--ink-700);border:1px solid var(--ink-600);display:flex;align-items:center;justify-content:center}
.lb-close svg{width:16px;height:16px;stroke:var(--paper-50);fill:none;stroke-width:2;stroke-linecap:round}
.lb-caption{margin-top:12px;text-align:center;font-size:13px;color:var(--slate-400)}
.lb-caption small{display:block;color:var(--slate-500);font-size:11px;margin-top:4px;font-family:"JetBrains Mono",monospace}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--ink-700);border:1px solid var(--ink-600);color:var(--paper-50);
  padding:11px 20px;border-radius:var(--r-input);font-size:13px;
  opacity:0;pointer-events:none;z-index:120;transition:opacity .2s var(--ease),transform .2s var(--ease);
  max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.page-footer{margin-top:36px;text-align:center;font-size:11px;color:var(--slate-500);line-height:2}
.page-footer .pf-row{display:flex;align-items:center;justify-content:center;gap:8px;font-family:"JetBrains Mono",monospace;margin-bottom:8px}

/* ============ 响应式 ============ */
@media (max-width:1180px){
  .board.has-failed{grid-template-columns:1fr}
  .home-hero{grid-template-columns:1fr;gap:26px}
  .onair-panel{max-width:380px}
}
@media (max-width:860px){
  body{padding:10px}
  .app{height:calc(100vh - 20px)}
  .sidebar{
    position:fixed;left:10px;top:10px;bottom:10px;z-index:60;
    transform:translateX(calc(-100% - 20px));
    transition:transform .2s var(--ease);
    border-radius:var(--r-panel);border:1px solid var(--ink-600);
    width:248px;
  }
  .app.nav-open .sidebar{transform:translateX(0)}
  .menu-btn{display:flex}
  .view-header{padding:12px 16px;flex-wrap:wrap;gap:10px}
  .vh-left{flex-wrap:wrap;flex:1 1 100%}
  .vh-date{display:block;flex-basis:calc(100% - 46px);margin-left:46px;white-space:nowrap}
  .view-body{padding:18px 16px 36px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .cap-grid{grid-template-columns:1fr}
  .flow-grid{grid-template-columns:repeat(2,1fr);gap:18px}
  .tpl-grid{grid-template-columns:1fr 1fr}
  .tpl-card-h{flex-direction:column;gap:0;padding:0}
  .tpl-card-h .tpl-cover-h{width:auto;margin:0;border-radius:0;border:none;border-bottom:1px solid var(--ink-600)}
  .tpl-card-h .tpl-info{padding:14px 16px 16px}
  .tpl-card-h .tpl-actions{max-width:none}
  .vp-grid,.skill-body,.rule-grid,.emp-grid,.ability-grid{grid-template-columns:1fr}
  .skill-col:first-child{border-right:none;border-bottom:1px solid var(--ink-600)}
  .filter-bar .search-box{margin-left:0;width:100%}
  .tabs{overflow-x:auto}
  .home-hero{padding:26px 22px}
  .home-hero h1{font-size:36px}
  .onair-247{font-size:54px}
}
@media (max-width:520px){
  .tpl-grid{grid-template-columns:1fr}
  .bgrid{grid-template-columns:1fr}
  .b-meta{grid-template-columns:76px 1fr}
  .flow-grid{grid-template-columns:1fr}
  .rec-table{display:block;overflow-x:auto;white-space:nowrap}
  #newTaskBtn{padding:9px 11px}
  #newTaskBtn .btn-label{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo-mark" viewBox="0 0 120 120" aria-label="UniStudio">
        <path class="u" d="M28 20V62a32 32 0 0 0 64 0V20"/>
        <circle class="dot-halo" cx="60" cy="38" r="10"/>
        <circle class="dot-halo h2" cx="60" cy="38" r="10"/>
        <circle class="dot" cx="60" cy="38" r="10"/>
      </svg>
      <span class="brand-name">UniStudio</span>
    </div>
    <nav class="side-nav" id="sideNav"><!-- JS 渲染 --></nav>
    <div class="side-spacer"></div>
    <div class="side-foot">
      <div class="sf-row">
        <span class="sf-dots"><i></i><i></i><i></i><i></i></span>
        <span>AI 工作流</span>
      </div>
      <div class="sf-sub">按需执行 · 可接入调度</div>
    </div>
  </aside>
  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- ===== 主区域 ===== -->
  <main class="main">
    <header class="view-header">
      <div class="vh-left">
        <button class="menu-btn" id="menuBtn" aria-label="打开导航">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="vh-title" id="vhTitle"></h1>
        <span class="vh-date mono" id="vhDate"></span>
      </div>
      <div class="vh-right" id="vhRight"></div>
    </header>
    <div class="view-body" id="viewBody"><!-- JS 渲染 --></div>
  </main>
</div>

<!-- 新建任务弹窗 -->
<div class="modal-mask" id="newTaskModal">
  <div class="modal">
    <h3>新建任务 · 从模板开始</h3>
    <p class="m-lede">填写内容并选择模板，复制制作指令交给当前 AI。AI 会检查环境、制作视频并登记到本地任务看板。</p>
    <textarea id="newTaskBrief" rows="3" placeholder="本期要制作什么？可填写文案、主题或素材路径" style="width:100%;padding:12px;margin-bottom:12px;color:inherit;background:var(--ink-900);border:1px solid var(--ink-600);border-radius:8px"></textarea>
    <div class="modal-list" id="modalList"></div>
    <div id="taskPromptBox" hidden><textarea id="taskPrompt" rows="6" readonly aria-label="交给 AI 的制作指令" style="width:100%;padding:12px;color:inherit;background:var(--ink-900)"></textarea><button class="btn btn-primary btn-sm" id="copyTaskPrompt">复制制作指令</button></div>
    <button class="btn btn-ghost btn-sm" id="modalClose">关闭</button>
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <div class="lb-content">
    <button class="lb-close" id="lbClose" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="lbMedia"></div>
    <div class="lb-caption" id="lbCaption"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * UniStudio · 创作工作室单页（品牌规范 v1.0 对齐）

/* ---------- 工具函数 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function fmtDur(sec){
  if(typeof sec==='string'&&/^\d+:\d{2}$/.test(sec))return sec;
  if(sec==null||isNaN(sec))return '';
  const m=Math.floor(sec/60), s=Math.round(sec%60);
  return `${pad(m)}:${pad(s)}`;
}
function fmtDateTime(iso){
  const d=new Date(iso); if(isNaN(d))return '';
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtTime(iso){
  const d=new Date(iso); if(isNaN(d))return '';
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtHeaderDate(iso){
  const d=new Date(iso); if(isNaN(d))return '';
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDay(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

/* ============================================================
 * 视图：任务看板（成片发布看板）
 * 定位：制作完成的成片统一在此管理——按状态 / 平台 / 关键词筛选，
 *       按日期分组展示发布状态与制作流水，点封面在线播放成片。
 * ============================================================ */
function boardFiltered(){
  const k=state.taskQ.trim().toLowerCase();
  return boardItems().filter(r=>{
    const visibleStatus=boardStatus(r);
    const okS=state.taskStatus==='all'||visibleStatus===state.taskStatus;
    const okP=state.taskPlatform==='all'||(r.platform||'未指定')===state.taskPlatform;
    const okQ=!k||[r.id,r.project,r.short_title,r.description,(r.topics||[]).join(' '),r.collection,r.template,visibleStatus]
      .join(' ').toLowerCase().includes(k);
    return okS&&okP&&okQ;
  });
}
function boardStatus(r){return ['published','platform_pending'].includes(r.status)?'published':'ready';}
function boardItems(){return state.tasks.filter(r=>!['producing','production_failed'].includes(r.status)&&(r.video||r.cover));}
function statusChips(){
  const counts={ready:0,published:0};
  boardItems().forEach(r=>{
    counts[boardStatus(r)]++;
  });
  const chips=['ready','published'].filter(s=>counts[s]).map(s=>{
    const m=STATUS_META[s]||{label:s,color:'#8C98AB'};
    const on=state.taskStatus===s;
    return `<button class="bchip ${on?'on':''}" data-bstatus="${s}" style="${on?`color:${m.color}`:''}">
      <i></i><span class="bc-lbl">${m.label}</span><span class="bc-n">${counts[s]}</span></button>`;
  }).join('');
  return `<button class="bchip ${state.taskStatus==='all'?'on':''}" data-bstatus="all"><span class="bc-lbl">全部</span><span class="bc-n">${counts.ready+counts.published}</span></button>${chips}`;
}
function platformChips(){
  const counts={};
  boardItems().forEach(r=>{const p=r.platform||'未指定';counts[p]=(counts[p]||0)+1;});
  const chips=Object.keys(counts).sort().map(p=>
    `<button class="bchip ${state.taskPlatform===p?'on':''}" data-bplatform="${esc(p)}"><span class="bc-lbl">${esc(p)}</span><span class="bc-n">${counts[p]}</span></button>`).join('');
  return `<button class="bchip ${state.taskPlatform==='all'?'on':''}" data-bplatform="all"><span class="bc-lbl">全部平台</span></button>${chips}`;
}
function boardToolbarHTML(){
  return `<div class="board-toolbar" id="boardToolbar">
    <div class="bf-row"><span class="bf-label">状态</span>${statusChips()}</div>
    <div class="bf-row"><span class="bf-label">平台</span>${platformChips()}
      <input id="boardSearch" type="search" placeholder="搜标题 / 工程 / 话题 / 记录 ID" value="${esc(state.taskQ)}" aria-label="搜索"></div>
  </div>`;
}
function relDay(day){
  const today=fmtDay(new Date());
  if(day===today)return '今天';
  const y=new Date(Date.now()-864e5);
  if(day===fmtDay(y))return '昨天';
  return '';
}
function bcard(r){
  const shownStatus=boardStatus(r);
  const st=STATUS_META[shownStatus]||{label:shownStatus,color:'#8C98AB',step:0};
  const acc=st.color;
  const platform=r.platform||'未指定';
  const dur=r.media&&r.media.duration||'';
  const specRes=r.media&&r.media.resolution||'';
  const specSize=r.media&&r.media.size_mb!=null?`${Number(r.media.size_mb).toFixed(1)} MB`:'';
  const len=r.short_title&&(r.platform_id==='wechat-channels'||r.platform==='视频号')?`${[...r.short_title].length}/16`:'';
  const topics=(r.topics&&r.topics.length)?r.topics.map(t=>`<span class="b-tag">#${esc(t)}</span>`).join(''):'';
  const rail=STATUS_STEPS.map((s,i)=>`<i class="${i<st.step?'on':''}${(st.alert&&i===st.step-1)?' now':''}"></i>`).join('');
  const note=r.last_note?`<p class="b-note" data-desc title="点击展开">${esc(r.last_note)}</p>`:'';
  const logRows=(r.log||[]).slice().reverse().map(l=>
    `<tr><td>${esc(String(l.at||'').replace('T',' ').slice(0,16))}</td><td>${esc(EVENT_LABEL[l.event]||l.event||'')}</td><td>${esc(l.note||'')}</td></tr>`).join('');
  const videoName=r.video?String(r.video).split('/').pop():'';
  const day=(r.story_date||'').slice(0,10)||fmtDay(new Date(r.updated_at||r.created_at||Date.now()));
  const dl=`
    <dl class="b-dl">
      <dt>资讯</dt><dd>${esc(day)}</dd>
      <dt>登记</dt><dd>${fmtDateTime(r.created_at)||'—'}</dd>
      <dt>核验</dt><dd>${fmtDateTime(r.updated_at)||'—'}</dd>
      <dt>合集</dt><dd>${esc(r.collection||'—')}</dd>
      <dt>模板</dt><dd>${esc(r.template||'—')}</dd>
      ${videoName?`<dt>成片</dt><dd><a href="${esc(r.video_url||'#')}" download>${esc(videoName)}</a></dd>`:''}
      <dt>工程</dt><dd>${esc(r.project||'—')}</dd>
    </dl>`;
  return `<article class="bcard ${st.alert?'alert':''}" data-status="${esc(r.status)}" data-platform="${esc(platform)}"
    data-search="${esc([r.id,r.project,r.short_title,r.description,(r.topics||[]).join(' '),r.collection,r.template,platform,r.status].join(' ').toLowerCase())}"
    style="--acc:${acc}">
    <div class="b-rail" role="img" aria-label="流程 ${st.step}/${STATUS_STEPS.length} · 当前 ${st.label}">${rail}</div>
    <div class="b-body">
      <div class="b-row1">
        <span class="b-pill">${st.label}</span>
        <button class="b-status-toggle" data-status-task="${esc(r.id)}" data-next-status="${shownStatus==='published'?'ready':'published'}" ${r.status==='publishing'?'disabled':''}>改为${shownStatus==='published'?'待发布':'已发布'}</button>
        <span class="b-plat">${esc(platform)}</span>
        ${r.attempts>1?`<span>试 ${r.attempts} 次</span>`:''}
        <span class="b-date">${esc(day)}</span>
      </div>
      <div class="b-title"><h4>${esc(r.short_title||r.project||'未命名任务')}</h4>${len?`<span class="b-len">${len}</span>`:''}</div>
      ${r.description?`<p class="b-desc" data-desc title="点击展开">${esc(r.description)}</p>`:''}
      ${topics?`<div class="b-tags">${topics}</div>`:''}
      ${note}
      <div class="b-meta">
        <div class="b-shot" data-task="${esc(r.id)}">
          ${r.cover_url?`<img src="${esc(r.cover_url)}" alt="封面" loading="lazy">`:''}
          <span class="b-play"><span>▶</span></span>
          ${dur?`<span class="b-dur">${esc(dur)}</span>`:''}
        </div>
        <div class="b-info">
          ${dl}
          <div class="b-specs">
            ${dur?`<b>时长 ${esc(dur)}</b>`:''}${specRes?`<b>${esc(specRes)}</b>`:''}${specSize?`<b>${specSize}</b>`:''}
          </div>
        </div>
      </div>
      ${logRows?`<details class="b-log"><summary>流水 · <code>${esc(r.id)}</code></summary><table><tbody>${logRows}</tbody></table></details>`:''}
    </div>
  </article>`;
}
function boardResultsHTML(){
  const list=boardFiltered();
  if(state.apiError)return `<div class="b-empty">${esc(state.apiError)} · 请检查本地任务服务</div>`;
  if(!list.length)return `<div class="b-empty">${state.tasks.length?'没有匹配的任务 · 换个筛选条件再试':'还没有任务 · 选择模板，把制作指令交给 AI，完成后成片会自动登记在这里'}</div>`;
  const groups={};
  list.forEach(r=>{
    const day=(r.story_date||'').slice(0,10)||fmtDay(new Date(r.updated_at||r.created_at||Date.now()));
    (groups[day]=groups[day]||[]).push(r);
  });
  return Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(day=>{
    const rel=relDay(day);
    return `<section class="bday">
      <h2 class="bday-head"><span class="bd-date">${esc(day)}</span>${rel?`<span class="bd-rel">${rel}</span>`:''}<span class="bd-n">${groups[day].length} 条</span></h2>
      <div class="bgrid">${groups[day].map(bcard).join('')}</div>
    </section>`;
  }).join('');
}

          <ul class="emp-duties">${e.duties.map(d=>`<li>${d}</li>`).join('')}</ul>
        </article>`).join('')}
    </div>

    <section class="sop-panel">
      <h3>标准作业流程 SOP</h3>
      <p class="sop-lede">从选模板到已接入的平台发布，由当前 AI 按 SOP 执行；持续值守需在 AI 运行器中另行配置调度。</p>
      <div class="flow-grid">
        <div class="flow-step"><span class="fs-num">01</span><h4>选一个模板</h4><p>选中即可复刻同款视频</p></div>
        <div class="flow-step"><span class="fs-num">02</span><h4>数字员工在岗制作</h4><p>检查已有环境，按模板制作</p></div>
        <div class="flow-step"><span class="fs-num">03</span><h4>看板统一管理</h4><p>成片集中归档，随时查看</p></div>
        <div class="flow-step"><span class="fs-num">04</span><h4>自动发布到平台</h4><p>按已接入的平台 Skill 执行</p></div>
      </div>
    </section>

    <div class="section-head"><h2>数字员工能力清单</h2></div>
    <div class="ability-grid">
      <div class="ability-card"><h4>自动拍摄流程</h4><p>按模板 SOP 自动完成镜头编排、画面切换与竖屏拍摄，无需人工值守。</p></div>
      <div class="ability-card"><h4>自动写口播稿</h4><p>按选题与素材生成口播稿，配合指定音色生成旁白，时长自动对齐。</p></div>
      <div class="ability-card"><h4>自动剪辑成片</h4><p>字幕、配乐、转场、片尾与水印按规范自动合成，输出 1080×1920 成片。</p></div>
      <div class="ability-card"><h4>成片检查与异常记录</h4><p>检查视频、音轨和封面，失败记录原因；发布结果不明时先核验再恢复。</p></div>
      <div class="ability-card"><h4>自动定时发布</h4><p>按排期自动上传发表，原创声明、合集与字段一次落定。</p></div>
      <div class="ability-card"><h4>状态自动回流</h4><p>发布结果回读核验并写入平台库，看板实时展示，不做假成功。</p></div>
    </div>

    <div class="page-footer">
      <div class="pf-row"><span class="tally"></span>AI 工作流 · 制作、检查、发布、核验</div>
    </div>
  </div>`;
}

/* ============================================================
 * 渲染调度
 * ============================================================ */
const VIEW_META={
  home:{title:'首页',render:renderHome},
  templates:{title:'模板总览',render:renderTemplates},
  tasks:{title:'任务看板',render:renderTasksView},
  publish:{title:'发布 Skill',render:renderPublish},
  employees:{title:'数字员工',render:renderEmployees},
};
function renderTasksView(){return renderBoard();}
function renderHeader(){
  const meta=VIEW_META[state.view];
  document.getElementById('vhTitle').textContent=meta.title;
  tickClock();
  document.getElementById('vhRight').innerHTML=state.view==='tasks'?boardHeaderRight():'';
}
/* 顶部实时时钟（当前日期时间） */
function fmtNow(){
  const d=new Date();
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function tickClock(){
  document.getElementById('vhDate').textContent=fmtNow();
}
setInterval(tickClock,10000); // 每 10 秒校准一次
function renderAll(){
  renderNav(); renderHeader();
  document.getElementById('viewBody').innerHTML=VIEW_META[state.view].render();
}

/* ---------- 移动端抽屉 ---------- */
function closeDrawer(){
  document.getElementById('app').classList.remove('nav-open');
  document.getElementById('navBackdrop').classList.remove('open');
}
function openDrawer(){
  document.getElementById('app').classList.add('nav-open');
  document.getElementById('navBackdrop').classList.add('open');
}

/* ---------- 新建任务弹窗 ---------- */
function renderModalList(){
  document.getElementById('modalList').innerHTML=TEMPLATES.map(t=>
    `<div class="modal-row">
      <div class="mr-thumb"><img src="${t.cover}" alt=""></div>
      <div class="mr-name">${t.name}<span class="mr-en">${t.en}</span></div>
      <button class="btn btn-primary btn-sm" data-modal-pick="${t.id}">选择</button>
    </div>`).join('');
}
function openModal(){document.getElementById('taskPromptBox').hidden=true;renderModalList();document.getElementById('newTaskModal').classList.add('open');}
function closeModal(){document.getElementById('newTaskModal').classList.remove('open');}

/* ---------- 路由 ---------- */
function go(view){
  if(!VIEW_META[view])view='home';
  state.view=view;
  if(location.hash!=='#/'+view)location.hash='#/'+view;
  renderAll();
  document.getElementById('viewBody').scrollTop=0;
  closeDrawer();
}
function route(){
  const r=location.hash.replace(/^#\/?/,'')||'home';
  state.view=VIEW_META[r]?r:'home';
  renderAll();
}

/* ---------- 事件绑定：视图内容（挂在持久容器 #viewBody） ---------- */
document.getElementById('viewBody').addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-shape],[data-type],[data-confirm],[data-sample],[data-task],[data-scroll],[data-bstatus],[data-bplatform],[data-desc],[data-status-task]');
  if(!t)return;
  if(t.dataset.statusTask){
    setManualBoardStatus(t);return;
  }
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.shape){state.tplShape=t.dataset.shape;renderAll();return;}
  if(t.dataset.type){state.tplType=t.dataset.type;renderAll();return;}
  if(t.dataset.bstatus){state.taskStatus=t.dataset.bstatus;refreshBoard();return;}
  if(t.dataset.bplatform){state.taskPlatform=t.dataset.bplatform;refreshBoard();return;}
  if(t.dataset.desc!==undefined){t.classList.toggle('open');return;}
  if(t.dataset.confirm){
    toast('请告诉 AI：把任务看板中的待发布视频发布到指定平台');
    e.stopPropagation();return;
  }
  if(t.dataset.sample){
    const tpl=TEMPLATES.find(x=>x.id===t.dataset.sample);
    if(tpl){
      openLightbox(`<video src="${tpl.sample}" controls autoplay muted playsinline></video>`,
        `${tpl.name} · 样片（演示静音）`);
    }
    return;
  }
  if(t.dataset.task){
    const r=state.tasks.find(x=>String(x.id)===t.dataset.task);
    if(r){
      const st=STATUS_META[boardStatus(r)]||{label:boardStatus(r)};
      const sub=`${st.label} · 更新于 ${fmtDateTime(r.updated_at)||'—'}`;
      if(r.video_url){
        openLightbox(`<video src="${r.video_url}" poster="${r.cover_url||''}" controls autoplay playsinline></video>`,
          r.short_title||r.project||'', sub);
      }else if(r.cover_url){
        openLightbox(`<img src="${r.cover_url}" alt="">`,r.short_title||r.project||'', sub);
      }else{
        toast('成片尚未生成，请稍候');
      }
    }
    return;
  }
  if(t.dataset.scroll){
    const el=document.querySelector(t.dataset.scroll);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
});

async function setManualBoardStatus(button){
  const id=button.dataset.statusTask;
  const status=button.dataset.nextStatus;
  button.disabled=true;
  try{
    const response=await fetch(`/api/records/${encodeURIComponent(id)}/status`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})
    });
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'状态更新失败');
    const index=state.tasks.findIndex(r=>String(r.id)===id);
    if(index>=0)state.tasks[index]=result.record;
    refreshBoard();
    toast(status==='published'?'已标记为已发布':'已调整为待发布');
    await load(false);
  }catch(error){
    toast(error.message||'状态更新失败');
    button.disabled=false;
  }
}

/* ---------- 事件绑定：新建任务弹窗列表 ---------- */
document.getElementById('modalList').addEventListener('click',e=>{
  const t=e.target.closest('[data-modal-pick]');
  if(!t)return;
  const tpl=TEMPLATES.find(x=>x.id===t.dataset.modalPick);
  if(!tpl)return;
  const brief=document.getElementById('newTaskBrief').value.trim()||'请先与我确定本期主题和内容';
  document.getElementById('taskPrompt').value=`请先阅读本项目根目录 AGENTS.md。使用模板 ${tpl.id}（${tpl.name}）制作视频。内容：${brief}。先检查当前环境已有的 HyperFrames 与 TTS；在 productions/projects/ 下复制新工程，按模板说明制作和核验，成片与封面存到 deliver/，完成后用 scripts/unistudio.py ready 自动登记到任务看板。`;
  document.getElementById('taskPromptBox').hidden=false;
  document.getElementById('taskPrompt').scrollIntoView({block:'nearest'});
});

document.getElementById('copyTaskPrompt').addEventListener('click',async()=>{
  const box=document.getElementById('taskPrompt');
  try{await navigator.clipboard.writeText(box.value);toast('已复制，请交给当前 AI 执行');}
  catch(e){box.focus();box.select();toast('请复制选中的制作指令，交给当前 AI');}
});

/* ---------- 事件绑定：侧边导航 + 看板顶部按钮（挂 document） ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[id]');
  if(!t)return;
  if(t.id==='newTaskBtn'){openModal();return;}
  if(t.dataset.view){go(t.dataset.view);return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='boardSearch'){
    state.taskQ=e.target.value;
    const br=document.getElementById('boardResults');
    if(br)br.innerHTML=boardResultsHTML();   // 输入框在 #boardToolbar 外，重渲染结果不丢焦点
    const sh=document.getElementById('boardShown');
    if(sh)sh.textContent=boardFiltered().length;
    return;
  }
  if(e.target.id!=='tplSearch')return;
  state.tplQ=e.target.value;
  const box=document.getElementById('tplContent');
  if(box)box.innerHTML=tplContentHTML(); // 输入框在 #tplContent 外，重渲染不丢焦点
});
/* 固定按钮 / 遮罩层 */
document.getElementById('menuBtn').addEventListener('click',openDrawer);
document.getElementById('navBackdrop').addEventListener('click',closeDrawer);
document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('newTaskModal').addEventListener('click',e=>{if(e.target.id==='newTaskModal')closeModal();});
document.getElementById('lbClose').addEventListener('click',closeLightbox);
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeLightbox();closeModal();closeDrawer();}
});
window.addEventListener('hashchange',route);

/* ---------- 启动：加载真实数据后渲染 ---------- */
async function load(refresh=false){
  if(refresh&&document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  try{
    const get=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();};
    const [st,rec]=await Promise.all([get('/api/stats'),get('/api/records')]);
    if(!Array.isArray(rec.records)||!st.by_status)throw new Error('任务服务响应不完整');
    const changed=JSON.stringify(state.tasks)!==JSON.stringify(rec.records)||state.apiError;
    state.stats=st;state.tasks=rec.records;state.apiError='';
    if(refresh&&!changed)return;
  }catch(e){
    state.apiError='暂时无法读取任务数据';
    if(!refresh){state.stats=null;state.tasks=[];}
  }
  route();
}
load();
setInterval(()=>load(true),15000);




</script>
